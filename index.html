<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Contas da casa</title>
<meta name="theme-color" content="#EAF0EC">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏠</text></svg>">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EAF0EC; --surface:#FFFFFF; --sunk:#F3F7F4; --ink:#13302A; --muted:#566C65; --line:#D2DDD7;
  --p0:#A3245F; --p1:#1A6683;
  --warn:#8A5A00; --warn-bg:#FBEBC0; --ok:#256B43; --ok-bg:#D8EEDF; --bad:#A8201A; --bad-bg:#F9DEDA;
  --btn:#13302A; --btn-ink:#FFFFFF;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1916; --surface:#15231F; --sunk:#1B2C27; --ink:#E3EEE9; --muted:#9AB1A9; --line:#2B3E38;
    --p0:#EE86B4; --p1:#72C3E0;
    --warn:#F3C766; --warn-bg:#3A3017; --ok:#78D3A0; --ok-bg:#1B3427; --bad:#F59A90; --bad-bg:#3E201D;
    --btn:#E3EEE9; --btn-ink:#0E1916;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1916; --surface:#15231F; --sunk:#1B2C27; --ink:#E3EEE9; --muted:#9AB1A9; --line:#2B3E38;
  --p0:#EE86B4; --p1:#72C3E0;
  --warn:#F3C766; --warn-bg:#3A3017; --ok:#78D3A0; --ok-bg:#1B3427; --bad:#F59A90; --bad-bg:#3E201D;
  --btn:#E3EEE9; --btn-ink:#0E1916;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;padding-bottom:84px}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:620px;margin:0 auto;padding:0 16px}

/* topo */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:8px;height:56px}
.top h1{flex:1;margin:0;font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:-.01em;text-align:center}
.iconbtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;font-size:18px;line-height:1}
.iconbtn:disabled{opacity:.35;cursor:default}

/* hero do acerto */
.hero{padding:28px 0 20px}
.acerto{font-family:var(--display);font-weight:700;font-size:clamp(28px,7.2vw,40px);line-height:1.08;letter-spacing:-.02em;margin:0 0 10px}
.acerto .v{white-space:nowrap}
.c0{color:var(--p0)} .c1{color:var(--p1)}
.hero p.sub{margin:0;color:var(--muted)}
.hero-acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}

.btn{border:0;border-radius:999px;padding:11px 18px;background:var(--btn);color:var(--btn-ink);font-weight:700;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.btn.small{padding:7px 13px;font-size:14px}
.btn.danger{background:transparent;color:var(--bad);border:1.5px solid var(--bad)}
.link{background:none;border:0;padding:0;color:var(--ink);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:14px}
:focus-visible{outline:3px solid var(--p1);outline-offset:2px}

/* balança por pessoa */
.balanca{display:grid;gap:14px;padding:18px;background:var(--surface);border-radius:18px;border:1px solid var(--line)}
.pessoa-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.pessoa-top .nome{font-family:var(--display);font-weight:700;font-size:18px;color:var(--c)}
.pessoa-top .parte{font-weight:700}
.barra{height:10px;border-radius:6px;background:var(--sunk);margin:6px 0 5px;overflow:hidden;border:1px solid var(--line)}
.barra span{display:block;height:100%;background:var(--c);border-radius:6px}
.pessoa-sub{display:flex;justify-content:space-between;gap:8px;font-size:14px;color:var(--muted);flex-wrap:wrap}
.rendas{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;color:var(--muted);padding-top:10px;border-top:1px dashed var(--line)}

/* seções */
section{margin-top:28px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:10px}
.sec-h h2{font-family:var(--display);font-weight:700;font-size:21px;margin:0;letter-spacing:-.01em}
.sec-h .meta{color:var(--muted);font-size:14px;text-align:right}

/* lista de contas */
.lista{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.lista li+li{border-top:1px solid var(--line)}
.conta{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;width:100%;padding:13px 14px;background:none;border:0;text-align:left;cursor:pointer}
.conta:hover{background:var(--sunk)}
.dia{width:44px;height:44px;border-radius:12px;background:var(--sunk);border:1px solid var(--line);display:grid;place-items:center;line-height:1;font-family:var(--display);font-weight:700;font-size:17px}
.dia small{display:block;font-family:var(--body);font-weight:400;font-size:10px;color:var(--muted);margin-bottom:2px}
.conta .nm{font-weight:700;text-transform:capitalize}
.conta .rg{font-size:13px;color:var(--muted)}
.conta .dir{text-align:right}
.conta .vl{font-weight:700}
.chips{display:flex;gap:4px;justify-content:flex-end;flex-wrap:wrap;margin-top:3px}
.chip{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.bad{background:var(--bad-bg);color:var(--bad)}
.lista-foot{display:flex;justify-content:space-between;padding:12px 14px;background:var(--sunk);font-weight:700}

/* movimentos */
.mov{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:11px 14px}
.mov .d{font-size:13px;color:var(--muted)}
.mov .t{font-weight:700}
.mov .x{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:none;cursor:pointer;color:var(--muted)}
.vazio{padding:18px 14px;color:var(--muted);text-align:center}

/* histórico */
.hist-row{display:grid;grid-template-columns:120px 1fr auto;gap:12px;align-items:center;padding:12px 14px}
.hbar{height:12px;border-radius:6px;background:var(--sunk);overflow:hidden;border:1px solid var(--line)}
.hbar span{display:block;height:100%;background:var(--ink);opacity:.75}
.tblwrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:18px}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:460px}
th,td{padding:10px 12px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left;text-transform:capitalize;position:sticky;left:0;background:var(--surface)}
th{font-weight:700;color:var(--muted);font-size:13px}
td.up{color:var(--bad)} td.down{color:var(--ok)}
.nota{font-size:14px;color:var(--muted);margin:10px 2px 0}

/* ajustes */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}
.card p{margin:0 0 10px}
.card p:last-child{margin-bottom:0}

/* abas */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .wrap{display:grid;grid-template-columns:repeat(3,1fr);height:62px}
.tabs button{background:none;border:0;cursor:pointer;font-weight:700;color:var(--muted);font-size:15px;position:relative}
.tabs button[aria-current="page"]{color:var(--ink)}
.tabs button[aria-current="page"]::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--ink)}

.aviso{margin-top:14px;padding:12px 14px;border-radius:14px;background:var(--warn-bg);color:var(--warn);font-size:14px}

/* diálogo */
dialog{border:0;padding:0;border-radius:22px;width:min(520px,calc(100vw - 24px));max-height:calc(100% - 32px);background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(10,25,20,.45)}
.dlg{padding:22px 20px 18px;display:grid;gap:14px}
.dlg h3{margin:0;font-family:var(--display);font-size:22px;letter-spacing:-.01em}
.dlg .desc{margin:-6px 0 0;color:var(--muted);font-size:14px}
.campo{display:grid;gap:5px}
.campo span{font-size:14px;font-weight:700}
.campo input,.campo select,.campo textarea{width:100%;padding:11px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--sunk)}
.campo input:focus,.campo select:focus{border-color:var(--ink);outline:none}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check{display:flex;gap:8px;align-items:center;font-size:15px}
.dlg-act{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:4px}
.dlg-act .esq{margin-right:auto}
.det{display:grid;gap:6px;padding:12px;border-radius:12px;background:var(--sunk);font-size:15px}
.det div{display:flex;justify-content:space-between;gap:8px}

.toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--btn);color:var(--btn-ink);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:700;z-index:20;max-width:calc(100vw - 32px)}
.estado{padding:60px 8px;text-align:center;color:var(--muted)}
.login{max-width:380px;margin:0 auto;text-align:left;display:grid;gap:12px}
.estado h2{font-family:var(--display);color:var(--ink);margin:0 0 8px}
@media (prefers-reduced-motion:no-preference){ .barra span{transition:width .4s ease} }
.top .gbar .wrap{height:auto;padding-top:0;padding-bottom:8px;justify-content:center}
.gbtn{background:var(--sunk);border:1px solid var(--line);border-radius:999px;padding:6px 16px;font-weight:700;font-size:14px;cursor:pointer;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gbtn:disabled{cursor:default}
.glist{display:grid;gap:8px}
.gopt{width:100%;text-align:left;padding:14px;border-radius:14px;border:1.5px solid var(--line);background:var(--sunk);cursor:pointer;font-weight:700}
.gopt[aria-current="true"]{border-color:var(--ink);background:var(--surface)}
.pr{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:start;padding:12px 14px}
.pr .em{font-weight:700;word-break:break-all}
.pr select{margin-top:6px;width:100%;padding:9px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--sunk)}
.pend{margin:0 0 14px;border:1px solid var(--warn);border-left:6px solid var(--warn);border-radius:14px;background:var(--warn-bg);color:var(--ink)}
.pend summary{list-style:none;cursor:pointer;display:block;position:relative;padding:10px 40px 10px 52px;font-size:14px}
.pend summary::-webkit-details-marker{display:none}
.pend summary::before{content:"!";position:absolute;left:12px;top:50%;transform:translateY(-50%);width:28px;height:28px;border-radius:50%;background:var(--warn);color:var(--warn-bg);font-weight:800;font-size:17px;line-height:28px;text-align:center}
.pend summary::after{content:"\25BE";position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:14px;color:var(--warn)}
.pend[open] summary::after{content:"\25B4"}
.pend .pt{display:block;font-weight:700;color:var(--warn)}
.pend .ps{display:block;color:var(--ink)}
.pend .nb{white-space:nowrap}
.pend li button>.num{flex:none;white-space:nowrap;font-weight:700}
.pend li button>span:first-child{min-width:0;overflow-wrap:anywhere}
.pend{overflow:hidden}
.pend ul{list-style:none;margin:0;padding:0 8px 6px}
.pend li{min-width:0}
.pend li button{box-sizing:border-box;max-width:100%}
.pend li button{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;padding:10px 8px;background:none;border:0;border-top:1px solid var(--warn);border-radius:0;cursor:pointer;text-align:left;font-size:14px;color:var(--ink)}
.pend li button:hover{background:var(--surface)}
.pend li button small{display:block;color:var(--muted);font-size:12px}
.nota{overflow-wrap:anywhere}
.top .gbar .wrap{position:relative}
.top .gbar .gbtn{max-width:calc(100% - 120px)}
.avatar{position:absolute;right:16px;top:0;width:36px;height:36px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font-weight:800;font-size:15px;cursor:pointer;display:grid;place-items:center}
.avatar:hover{border-color:var(--ink)}
.avatar.grande{position:static;width:48px;height:48px;font-size:20px;flex:none;background:var(--sunk);cursor:default}
.conta-info{display:flex;align-items:center;gap:12px;margin:4px 0 14px}
.conta-acts{display:grid;gap:8px;margin:0 0 14px}
.conta-acts .btn{width:100%}
.conta-info strong{display:block;overflow-wrap:anywhere}
.conta-info small{color:var(--muted);font-size:14px}
details.sec>summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:18px;min-height:24px}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary h2{font-family:var(--display);font-weight:700;font-size:19px;margin:0;letter-spacing:-.01em}
details.sec>summary .meta{margin-left:auto;color:var(--muted);font-size:14px;text-align:right}
details.sec>summary::after{content:"\25BE";color:var(--muted);font-size:15px;flex:none}
details.sec[open]>summary::after{content:"\25B4"}
details.sec[open]>summary{margin-bottom:10px}
details.sec>summary:hover{border-color:var(--ink)}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <button class="iconbtn" id="prev" aria-label="Mês anterior">‹</button>
  <h1 id="titulo">Contas da casa</h1>
  <button class="iconbtn" id="next" aria-label="Próximo mês">›</button>
</div>
<div class="gbar" id="gbar" hidden><div class="wrap"><button class="gbtn" id="gbtn" type="button"></button><button class="avatar" id="conta" type="button" data-a="minhaconta" aria-label="Minha conta e sair" aria-haspopup="dialog" title="Minha conta"></button></div></div></header>
<main class="wrap" id="app"><div class="estado">Carregando…</div></main>
<nav class="tabs" aria-label="Seções"><div class="wrap">
  <button data-tab="mes" aria-current="page">Mês</button>
  <button data-tab="hist">Histórico</button>
  <button data-tab="ajustes">Ajustes</button>
</div></nav>
<dialog id="dlg"></dialog>

<script>
(function(){
"use strict";
const CFG=window.CONTAS_CONFIG||{};
function lerSec(){const o={contas:false,mov:false};try{for(const k in o)o[k]=localStorage.getItem("sec_"+k)==="1"}catch(e){}return o}
const S={sb:null,session:null,admin:false,status:"loading",grupos:[],membros:[],grupoId:null,mesGrupo:null,
  config:null,meses:{},todosPags:[],mesId:null,tab:"mes",enviado:null,modoLogin:"senha",seq:0,sec:lerSec()};
const MESES=["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
const fmt=new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"});
const brl=c=>fmt.format((c||0)/100);
const pctf=x=>(x*100).toLocaleString("pt-BR",{maximumFractionDigits:1})+"%";
const mesNome=id=>{const [y,m]=id.split("-").map(Number);return MESES[m-1]+" de "+y};
const mesCurto=id=>{const [y,m]=id.split("-").map(Number);return MESES[m-1].slice(0,3)+"/"+String(y).slice(2)};
const nextId=id=>{let [y,m]=id.split("-").map(Number);m++;if(m>12){m=1;y++}return y+"-"+String(m).padStart(2,"0")};
const prevId=id=>{let [y,m]=id.split("-").map(Number);m--;if(m<1){m=12;y--}return y+"-"+String(m).padStart(2,"0")};
const mesIdx=id=>{const [y,m]=id.split("-").map(Number);return y*12+(m-1)};
const idxMes=n=>Math.floor(n/12)+"-"+String(n%12+1).padStart(2,"0");
const somaMeses=(id,n)=>idxMes(mesIdx(id)+n);
const hoje=()=>new Date();
const hojeId=()=>{const d=hoje();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")};
const hojeISO=()=>{const d=hoje();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const dataBR=iso=>{if(!iso)return"";const [y,m,d]=String(iso).slice(0,10).split("-");return d+"/"+m};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const EMAIL=/^[^\s@]+@[^\s@]+\.[^\s@]+$/;
function parseBRL(str){let s=String(str??"").replace(/R\$|\s/g,"");if(!s)return NaN;if(s.includes(","))s=s.replace(/\./g,"").replace(",",".");const n=Number(s);return isFinite(n)?Math.round(n*100):NaN}
const toInput=c=>((c||0)/100).toFixed(2).replace(".",",");
const slug=s=>(String(s).normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"conta")+"-"+Math.random().toString(36).slice(2,6);
const slugSimples=s=>String(s).normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"casa";

const $=s=>document.querySelector(s);
const app=$("#app"),dlg=$("#dlg");

/* ---------- atalhos de estado ---------- */
const pessoas=()=>S.config?.moradores||[];
const nomeDe=id=>pessoas().find(p=>p.id===id)?.nome||id;
const corDe=id=>"c"+Math.max(0,pessoas().findIndex(p=>p.id===id));
const varCor=i=>"var(--p"+(i%2)+")";
const pagsMes=()=>S.todosPags.filter(p=>p.mes===S.mesId);
const emailMeu=()=>String(S.session?.user?.email||"").toLowerCase();
const grupoAtual=()=>S.grupos.find(g=>g.id===S.grupoId)||null;
const membrosDoGrupo=()=>S.membros.filter(m=>m.grupo_id===S.grupoId);
const souMembro=()=>membrosDoGrupo().some(m=>m.email===emailMeu());
const meuMorador=()=>membrosDoGrupo().find(m=>m.email===emailMeu())?.morador_id||null;
const salvarGrupo=id=>{try{localStorage.setItem("contas.grupo",id||"")}catch(e){}};
const lerGrupo=()=>{try{return localStorage.getItem("contas.grupo")||null}catch(e){return null}};

function regraTxt(c){
  if(c.regra==="igual")return pessoas().length===2?"meio a meio":"partes iguais";
  if(c.regra==="proporcional")return "pela renda";
  return pessoas().map(p=>(c.pct?.[p.id]??0)+"%").join(" / ");
}

const parcelaTxt=c=>c.parcela&&c.parcelas?"parcela "+c.parcela+" de "+c.parcelas:"";
/* Parcela que cai em um mês para um parcelamento, ou null se o mês está fora do período */
function parcelaDoMes(t,mesId){
  if(!t.parcelas||!t.inicio)return null;
  const n=mesIdx(mesId)-mesIdx(t.inicio)+1;
  return n>=1&&n<=t.parcelas?n:null;
}

/* ---------- banco de dados ---------- */
async function q(promessa){const {data,error}=await promessa;if(error)throw error;return data}
async function carregar(){
  const sb=S.sb,seq=++S.seq;
  const [gr,mb]=await Promise.all([
    q(sb.from("grupos").select("*").order("criado_em")),
    q(sb.from("grupo_membros").select("*"))
  ]);
  if(seq!==S.seq)return;
  S.grupos=gr;S.membros=mb;
  if(!S.grupos.some(g=>g.id===S.grupoId)){
    const salvo=lerGrupo();
    S.grupoId=S.grupos.some(g=>g.id===salvo)?salvo:(S.grupos[0]?.id||null);
  }
  if(S.mesGrupo!==S.grupoId){S.mesId=null;S.mesGrupo=S.grupoId}
  if(!S.grupoId){S.config=null;S.meses={};S.todosPags=[];S.status="ok";render();return}
  const gid=S.grupoId;
  const [mor,rec,mes,cm,pg]=await Promise.all([
    q(sb.from("moradores").select("*").eq("grupo_id",gid).order("ordem")),
    q(sb.from("contas_recorrentes").select("*").eq("grupo_id",gid)),
    q(sb.from("meses").select("*").eq("grupo_id",gid)),
    q(sb.from("contas_mes").select("*").eq("grupo_id",gid)),
    q(sb.from("pagamentos").select("*").eq("grupo_id",gid))
  ]);
  if(seq!==S.seq)return;
  S.config={moradores:mor.map(x=>({id:x.id,nome:x.nome})),contas:rec.map(x=>({id:x.id,nome:x.nome,dia:x.dia,regra:x.regra,pct:x.pct,valorPadrao:x.valor_padrao,parcelas:x.parcelas||null,inicio:x.inicio||null}))};
  const m={};mes.forEach(x=>m[x.id]={rendas:x.rendas||{},contas:{}});
  cm.forEach(x=>{if(m[x.mes_id])m[x.mes_id].contas[x.conta_id]={nome:x.nome,dia:x.dia,regra:x.regra,pct:x.pct,valor:x.valor,estimado:x.estimado,parcela:x.parcela||null,parcelas:x.parcelas||null}});
  S.meses=m;
  S.todosPags=pg.map(x=>({id:x.id,mes:x.mes_id,tipo:x.tipo,contaId:x.conta_id,quem:x.quem,de:x.de,para:x.para,valor:x.valor,data:x.data,obs:x.obs}));
  const ids=Object.keys(m).sort();
  if(!S.mesId||!m[S.mesId])S.mesId=m[hojeId()]?hojeId():ids[ids.length-1]||null;
  S.status="ok";render();
}

/* ---------- cálculo ---------- */
function calc(mes,pags){
  const ps=pessoas(),rendas=mes.rendas||{};
  const rendaTotal=ps.reduce((a,p)=>a+(rendas[p.id]||0),0);
  const devido={},pago={},pagoConta={};
  ps.forEach(p=>{devido[p.id]=0;pago[p.id]=0});
  for(const g of pags){
    if(g.tipo==="conta"){pago[g.quem]=(pago[g.quem]||0)+g.valor;pagoConta[g.contaId]=(pagoConta[g.contaId]||0)+g.valor}
    else if(g.tipo==="transferencia"){pago[g.de]=(pago[g.de]||0)+g.valor;pago[g.para]=(pago[g.para]||0)-g.valor}
  }
  const contas=Object.entries(mes.contas||{}).map(([id,c])=>{
    const w=ps.map(p=>c.regra==="igual"?1:c.regra==="proporcional"?(rendas[p.id]||0):(Number(c.pct?.[p.id])||0));
    const sw=w.reduce((a,b)=>a+b,0);
    const partes={};let acc=0;
    ps.forEach((p,i)=>{const v=i===ps.length-1?c.valor-acc:(sw?Math.round(c.valor*w[i]/sw):Math.round(c.valor/ps.length));partes[p.id]=v;acc+=v;devido[p.id]+=v});
    const pc=pagoConta[id]||0;
    const status=c.valor<=0?"semvalor":pc>=c.valor?"pago":pc>0?"parcial":"pendente";
    return Object.assign({id},c,{partes,pagoConta:pc,status});
  }).sort((a,b)=>(a.dia-b.dia)||String(a.nome).localeCompare(b.nome));
  const total=contas.reduce((a,c)=>a+c.valor,0);
  const falta=contas.reduce((a,c)=>a+Math.max(0,c.valor-c.pagoConta),0);
  const saldo={};ps.forEach(p=>saldo[p.id]=pago[p.id]-devido[p.id]);
  let devedor=null,credor=null;
  ps.forEach(p=>{if(saldo[p.id]<0&&(!devedor||saldo[p.id]<saldo[devedor]))devedor=p.id;if(saldo[p.id]>0&&(!credor||saldo[p.id]>saldo[credor]))credor=p.id});
  const acerto=devedor&&credor?Math.min(-saldo[devedor],saldo[credor]):0;
  return {ps,rendas,rendaTotal,contas,total,falta,devido,pago,saldo,devedor,credor,acerto};
}
function prazo(c,mesId){
  if(c.status==="pago"||c.status==="semvalor")return null;
  const atual=hojeId();
  if(mesId<atual)return{cls:"bad",txt:"Atrasada"};
  if(mesId>atual)return null;
  const diff=c.dia-hoje().getDate();
  if(diff<0)return{cls:"bad",txt:"Atrasada"};
  if(diff===0)return{cls:"warn",txt:"Vence hoje"};
  if(diff<=3)return{cls:"warn",txt:"Vence em "+diff+(diff===1?" dia":" dias")};
  return null;
}
const STATUS={pago:["ok","Paga"],parcial:["warn","Parcial"],pendente:["","Pendente"],semvalor:["","Sem valor"]};

/* ---------- telas ---------- */
function render(){
  const temAcesso=S.status==="ok"&&(S.grupos.length>0||S.admin);
  const g=grupoAtual();
  const mostraAbas=temAcesso&&!!g;
  $(".tabs").style.display=mostraAbas?"":"none";
  document.querySelectorAll(".tabs button").forEach(b=>b.setAttribute("aria-current",b.dataset.tab===S.tab?"page":"false"));
  const gbar=$("#gbar");
  if(mostraAbas){
    const interativo=S.grupos.length>1||S.admin;
    gbar.hidden=false;$("#conta").textContent=inicial();$("#gbtn").textContent=g.nome+(interativo?" ▾":"");$("#gbtn").disabled=!interativo;
  }else gbar.hidden=true;
  const membro=mostraAbas&&souMembro()&&pessoas().length>0;
  const ids=Object.keys(S.meses).sort(),i=ids.indexOf(S.mesId),naMes=mostraAbas&&S.tab==="mes"&&membro;
  $("#prev").disabled=!naMes||i<=0;$("#next").disabled=!naMes||i<0;
  $("#prev").style.visibility=$("#next").style.visibility=naMes?"visible":"hidden";
  $("#titulo").textContent=naMes&&S.mesId?mesNome(S.mesId):mostraAbas&&S.tab==="hist"?"Histórico":mostraAbas&&S.tab==="ajustes"?"Ajustes":"Contas da casa";

  if(S.status==="config"){app.innerHTML=`<div class="estado"><h2>Falta configurar</h2><p>Crie no repositório um arquivo chamado <strong>config.js</strong> com a Project URL e a chave pública do Supabase.</p></div>`;return}
  if(S.status==="loading"){app.innerHTML=`<div class="estado">Carregando…</div>`;return}
  if(S.status==="erro"){app.innerHTML=`<div class="estado"><h2>Não foi possível carregar</h2><p>Verifique a internet e tente de novo. Se o problema continuar, o banco pode não ter sido atualizado.</p><button class="btn" data-a="recarregar">Tentar de novo</button></div>`;return}
  if(S.status==="login"){renderLogin();return}
  if(!temAcesso){renderSemAcesso();return}
  if(!g){renderSemGrupo();return}
  if(S.tab==="ajustes"){renderAjustes();return}
  if(!souMembro()){renderNaoMembro();return}
  if(!pessoas().length){renderSemPessoas();return}
  if(S.tab==="mes")renderMes();else renderHist();
}

/* Contas em aberto e acerto pendente do mês anterior. Só informativo: não altera o cálculo do mês atual. */
function pendenciasAnteriores(){
  const pid=prevId(S.mesId),pm=S.meses[pid];
  if(!pm)return null;
  const pr=calc(pm,S.todosPags.filter(p=>p.mes===pid));
  const contas=pr.contas.filter(c=>c.status==="pendente"||c.status==="parcial")
    .map(c=>({id:c.id,nome:c.nome,dia:c.dia,falta:c.valor-c.pagoConta,parcial:c.status==="parcial",parcela:parcelaTxt(c)}));
  const acerto=pr.acerto>0?{de:pr.devedor,para:pr.credor,valor:pr.acerto}:null;
  if(!contas.length&&!acerto)return null;
  return {mesId:pid,contas,acerto,total:contas.reduce((a,c)=>a+c.falta,0)};
}
function htmlPendencias(){
  const p=pendenciasAnteriores();if(!p)return "";
  const partes=[];
  if(p.contas.length)partes.push(`<span class="nb">${p.contas.length+(p.contas.length===1?" conta":" contas")} (${brl(p.total)})</span>`);
  if(p.acerto)partes.push(`<span class="nb">acerto de ${brl(p.acerto.valor)}</span>`);
  const itens=p.contas.map(c=>`<li><button type="button" data-a="pagprev" data-mes="${p.mesId}" data-id="${esc(c.id)}"><span>${esc(c.nome)}<small>${c.parcela?esc(c.parcela)+", ":""}vence dia ${c.dia}${c.parcial?", paga em parte":""}</small></span><span class="num">${brl(c.falta)}</span></button></li>`).join("")
    +(p.acerto?`<li><button type="button" data-a="transfprev" data-mes="${p.mesId}" data-de="${esc(p.acerto.de)}" data-para="${esc(p.acerto.para)}" data-v="${p.acerto.valor}"><span>Acerto<small>${esc(nomeDe(p.acerto.de))} para ${esc(nomeDe(p.acerto.para))}</small></span><span class="num">${brl(p.acerto.valor)}</span></button></li>`:"");
  return `<details class="pend"><summary><span class="pt">Pendências de ${MESES[+p.mesId.slice(5)-1]}</span><span class="ps num">${partes.join(" e ")}</span></summary><ul>${itens}</ul></details>`;
}

function renderHist(){

  const max=Math.max(1,...tot.map(x=>x.t));
  const rows=tot.slice().reverse().map(x=>`<li class="hist-row"><span><strong>${MESES[+x.id.slice(5)-1]}</strong> ${x.id.slice(0,4)}${x.est?`<br><span class="chip warn">Tem estimativas</span>`:""}</span>

  }).join("");

function dlgNovoGrupo(){
  if(!S.admin)return;
  const bloco=(n,email)=>`<div class="duo">${campo("Pessoa "+n+": nome",`<input name="n${n}" required maxlength="30">`)}${campo("Pessoa "+n+": e-mail",`<input name="e${n}" type="email" required value="${esc(email)}" autocomplete="off">`)}</div>`;

function lerConta(fd){
  const ps=pessoas(),regra=fd.get("regra");let pct=null;
  if(regra==="custom"){pct={};let s=0;ps.forEach(p=>{pct[p.id]=Number(fd.get("pct_"+p.id))||0;s+=pct[p.id]});if(ps.some(p=>pct[p.id]<0)){toast("Os percentuais não podem ser negativos.");return null}if(Math.abs(s-100)>0.01){toast("Os percentuais precisam somar 100%.");return null}}
  const dia=Math.min(31,Math.max(1,parseInt(fd.get("dia"))||1));
  return {nome:String(fd.get("nome")).trim().toLowerCase(),dia,regra,pct};
}
function bindRegra(){
  const ps=pessoas(),box=$("#pctBox"),vEl=$('#dlg [name="valor"]');
  const P=id=>box.querySelector('[name="pct_'+id+'"]'),R=id=>box.querySelector('[name="rs_'+id+'"]');
  const T=()=>{const v=parseBRL(vEl?vEl.value:"");return isNaN(v)||v<0?0:v};
  const fp=x=>String(Math.round(x*10000)/10000),pv=id=>Math.max(0,Number(P(id).value)||0);
  const cents=(id,t)=>Math.round(t*pv(id)/100);
  function dica(alvo){
    const t=T();
    $("#pctHint").textContent=!ps.length?"":t>0?(alvo?"Digite em % ou em R$. O restante vai para "+alvo.nome+": "+fp(pv(alvo.id))+"% (R$ "+toInput(cents(alvo.id,t))+").":"Digite em % ou em R$."):"Para digitar em reais, informe antes o valor da conta. Por enquanto vale o percentual.";
  }
  function tudo(){const t=T();ps.forEach(p=>{R(p.id).disabled=t<=0;R(p.id).value=t>0?toInput(cents(p.id,t)):""});dica(null)}
  function resto(from){
    if(ps.length<2)return;
    const alvo=from===ps[ps.length-1].id?ps[0]:ps[ps.length-1],outros=ps.filter(p=>p.id!==alvo.id),t=T();
    P(alvo.id).value=fp(Math.max(0,100-outros.reduce((a,p)=>a+pv(p.id),0)));
    if(t>0)R(alvo.id).value=toInput(Math.max(0,t-outros.reduce((a,p)=>a+cents(p.id,t),0)));
    dica(alvo);
  }
  $("#selRegra").addEventListener("change",e=>{box.hidden=e.target.value!=="custom";if(!box.hidden)tudo()});
  ps.forEach(p=>{
    P(p.id).addEventListener("input",()=>{const t=T();if(t>0)R(p.id).value=toInput(cents(p.id,t));resto(p.id)});
    R(p.id).addEventListener("input",()=>{const t=T();if(t<=0)return;let c=parseBRL(R(p.id).value);if(isNaN(c)||c<0)c=0;P(p.id).value=fp(Math.min(100,c/t*100));resto(p.id)});
  });
  if(vEl)vEl.addEventListener("input",tudo);
  tudo();
}
function dlgEditConta(id){
  const mes=S.meses[S.mesId],c=id?mes.contas[id]:null;
  openDlg(id?"Editar conta do mês":"Nova conta neste mês",id?"A mudança vale só para "+mesNome(S.mesId)+".":"Para repetir todo mês, cadastre em Ajustes.",
    formConta(c)+(id&&c.estimado?`<label class="check"><input type="checkbox" name="conf" checked> Valor confirmado pela fatura</label>`:""),
    (id?`<button class="btn danger esq" value="del" formnovalidate>Remover</button>`:"")+cancelar+`<button class="btn" value="ok">Salvar</button>`,
    async(fd,act)=>{
      if(act==="del"){
        if(pagsMes().some(g=>g.contaId===id)){toast("Exclua antes os pagamentos desta conta.");return false}
        if(!confirm("Remover esta conta de "+mesNome(S.mesId)+"?"))return false;
        await q(S.sb.from("contas_mes").delete().eq("grupo_id",gid()).eq("mes_id",S.mesId).eq("conta_id",id));toast("Conta removida.");return;
      }
      const base=lerConta(fd);if(!base)return false;
      const v=parseBRL(fd.get("valor")||"0");if(isNaN(v)||v<0){toast("Valor inválido.");return false}
      await q(S.sb.from("contas_mes").upsert(Object.assign({grupo_id:gid(),mes_id:S.mesId,conta_id:id||slug(base.nome)},base,{valor:v,estimado:id?(c.estimado&&!fd.get("conf")):false})));
      toast("Conta salva.");
    });
  bindRegra();
}
function dlgRendas(){
  const mes=S.meses[S.mesId];
  openDlg("Rendas de "+mesNome(S.mesId),"Usadas nas contas divididas pela renda. O próximo mês aberto copia estes valores.",
    pessoas().map(p=>campo(esc(p.nome)+" (R$)",valInput("r_"+p.id,mes.rendas?.[p.id]||0))).join(""),
    cancelar+`<button class="btn" value="ok">Salvar</button>`,
    async fd=>{const rendas={};for(const p of pessoas()){const v=parseBRL(fd.get("r_"+p.id));if(isNaN(v)||v<0){toast("Renda inválida.");return false}rendas[p.id]=v}
      await q(S.sb.from("meses").update({rendas}).eq("grupo_id",gid()).eq("id",S.mesId));toast("Rendas atualizadas.");});
}
const LBL_FIXA="Valor padrão (R$), usado só se não houver mês anterior",LBL_PARC="Valor de cada parcela (R$)";
function opcoesMeses(sel){
  const ini=somaMeses(hojeId(),-24),ids=[];
  for(let i=0;i<=30;i++)ids.push(somaMeses(ini,i));
  if(sel&&!ids.includes(sel)){ids.push(sel);ids.sort()}
  return ids.map(id=>`<option value="${id}" ${id===sel?"selected":""}>${mesNome(id)}</option>`).join("");
}
/* Cria a parcela nos meses já abertos (a partir de "desde") que ainda não a têm */
async function completarParcelas(t,desde){
  desde=desde||S.mesId||hojeId();
  const linhas=[];
  for(const mid of Object.keys(S.meses).sort()){
    if(mid<desde)continue;
    const n=parcelaDoMes(t,mid);
    if(!n||S.meses[mid].contas[t.id])continue;
    linhas.push({grupo_id:gid(),mes_id:mid,conta_id:t.id,nome:t.nome,dia:t.dia,regra:t.regra,pct:t.pct||null,valor:t.valorPadrao,estimado:false,parcela:n,parcelas:t.parcelas});
  }
  if(linhas.length)await q(S.sb.from("contas_mes").insert(linhas));
  return linhas.length;
}
function dlgTpl(id,parcelado){
  const c=id?S.config.contas.find(x=>x.id===id):null;
  const eParc=c?!!c.parcelas:!!parcelado,desde=S.mesId||hojeId();
  const extra=`<div id="parcBox" ${eParc?"":"hidden"} style="display:${eParc?"grid":"none"};gap:14px">
    <div class="duo">${campo("Número de parcelas",`<input name="parcelas" type="number" min="2" max="120" step="1" inputmode="numeric" value="${c?.parcelas||""}" placeholder="Ex.: 10">`)}${campo("Primeira parcela em",`<select name="inicio">${opcoesMeses(c?.inicio||desde)}</select>`)}</div>
    <p class="nota" style="margin:0">Se a compra já começou, escolha o mês da primeira parcela. As parcelas só são criadas de ${mesNome(desde)} em diante, os meses anteriores não mudam. Mudanças aqui valem para os meses ainda não abertos.</p></div>`;
  const tipo=campo("Tipo",`<select name="tipo" id="selTipo"><option value="fixa" ${eParc?"":"selected"}>Fixa, repete todo mês</option><option value="parcelada" ${eParc?"selected":""}>Parcelada, termina após certo número de parcelas</option></select>`);
  openDlg(id?(eParc?"Conta parcelada":"Conta recorrente"):(eParc?"Parcelar uma compra":"Nova conta recorrente"),"Entra automaticamente em cada mês novo.",
    tipo+formConta(c?Object.assign({},c,{valor:c.valorPadrao}):null,eParc?LBL_PARC:LBL_FIXA,extra),
    (id?`<button class="btn danger esq" value="del" formnovalidate>Remover</button>`:"")+cancelar+`<button class="btn" value="ok">Salvar</button>`,
    async(fd,act)=>{
      if(act==="del"){
        const msg=c?.parcelas?"Parar de gerar as próximas parcelas? As parcelas dos meses já abertos continuam.":"Parar de gerar esta conta nos próximos meses?";
        if(!confirm(msg))return false;await q(S.sb.from("contas_recorrentes").delete().eq("grupo_id",gid()).eq("id",id));toast("Conta removida dos próximos meses.");return}
      const base=lerConta(fd);if(!base)return false;const v=parseBRL(fd.get("valor")||"0");
      const parc=fd.get("tipo")==="parcelada";
      let parcelas=null,inicio=null;
      if(parc){
        parcelas=parseInt(fd.get("parcelas"),10);
        if(!(parcelas>=2&&parcelas<=120)){toast("Informe o número de parcelas, de 2 a 120.");return false}
        if(!(v>0)){toast("Informe o valor de cada parcela.");return false}
        inicio=String(fd.get("inicio"));
      }
      const rid=id||slug(base.nome);
      const reg=Object.assign({grupo_id:gid(),id:rid},base,{valor_padrao:isNaN(v)?0:v});
      if(parc||c?.parcelas){reg.parcelas=parcelas;reg.inicio=inicio}
      await q(S.sb.from("contas_recorrentes").upsert(reg));
      let n=0;
      if(parc)n=await completarParcelas({id:rid,nome:base.nome,dia:base.dia,regra:base.regra,pct:base.pct,valorPadrao:reg.valor_padrao,parcelas,inicio},desde);
      toast(parc?(n?"Parcelamento salvo. "+n+(n===1?" parcela lançada":" parcelas lançadas")+" nos meses abertos.":"Parcelamento salvo."):"Conta recorrente salva.");
    });
  bindRegra();
  $("#selTipo").addEventListener("change",e=>{
    const p=e.target.value==="parcelada";
    const box=$("#parcBox");box.hidden=!p;box.style.display=p?"grid":"none";
    $("#lblValor").textContent=p?LBL_PARC:LBL_FIXA;
  });
}
function dlgMoradores(){
  const ps=pessoas();
  openDlg("Nomes das pessoas","",
    ps.map((p,i)=>campo("Pessoa "+(i+1),`<input name="n_${esc(p.id)}" required maxlength="30" value="${esc(p.nome)}">`)).join(""),
    cancelar+`<button class="btn" value="ok">Salvar</button>`,
    async fd=>{
      const linhas=ps.map((p,i)=>({grupo_id:gid(),id:p.id,nome:String(fd.get("n_"+p.id)).trim()||p.nome,ordem:i}));
      await q(S.sb.from("moradores").upsert(linhas));toast("Nomes atualizados.");
    });
}

/* ---------- ações ---------- */
async function abrirMes(novoId){
  await carregar();
  if(!S.meses[novoId]){
    const ids=Object.keys(S.meses).sort().filter(x=>x<novoId),base=ids.length?S.meses[ids[ids.length-1]]:null;
    await q(S.sb.from("meses").insert({grupo_id:gid(),id:novoId,rendas:base?.rendas||{}}));
    const linhas=[];
    for(const t of S.config.contas||[]){
      const comum={grupo_id:gid(),mes_id:novoId,conta_id:t.id,nome:t.nome,dia:t.dia,regra:t.regra,pct:t.pct||null};
      if(t.parcelas){
        const n=parcelaDoMes(t,novoId);if(!n)continue;
        linhas.push(Object.assign(comum,{valor:t.valorPadrao||0,estimado:false,parcela:n,parcelas:t.parcelas}));
      }else linhas.push(Object.assign(comum,{valor:base?.contas?.[t.id]?.valor??t.valorPadrao??0,estimado:true}));
    }
    if(linhas.some(l=>"parcela" in l))linhas.forEach(l=>{if(!("parcela" in l)){l.parcela=null;l.parcelas=null}});
    if(linhas.length)await q(S.sb.from("contas_mes").insert(linhas));
    toast(mesNome(novoId)+" aberto.");
  }
  S.mesId=novoId;await carregar();window.scrollTo(0,0);
}
async function delPag(id){
  if(!confirm("Excluir este movimento?"))return;
  await q(S.sb.from("pagamentos").delete().eq("grupo_id",gid()).eq("id",id));toast("Movimento excluído.");await carregar();
}
function exportCSV(){
  const qt=v=>`"${String(v??"").replace(/"/g,'""')}"`,n=c=>((c||0)/100).toFixed(2).replace(".",",");
  const L=["tipo;mes;data;conta;pessoa;para;valor;regra;estimado;obs;parcela"];
  for(const id of Object.keys(S.meses).sort()){
    const m=S.meses[id];
    for(const c of Object.values(m.contas||{}))L.push(["conta",id,"",qt(c.nome),"","",n(c.valor),qt(regraTxt(c)),c.estimado?"sim":"não","",c.parcela?c.parcela+"/"+c.parcelas:""].join(";"));
    for(const g of S.todosPags.filter(p=>p.mes===id))L.push([g.tipo==="conta"?"pagamento":"transferencia",id,g.data,qt(g.tipo==="conta"?m.contas?.[g.contaId]?.nome:""),qt(nomeDe(g.tipo==="conta"?g.quem:g.de)),qt(g.para?nomeDe(g.para):""),n(g.valor),"","",qt(g.obs),""].join(";"));
  }
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+L.join("\n")],{type:"text/csv;charset=utf-8"}));
  a.download="contas-"+slugSimples(grupoAtual()?.nome||"casa")+".csv";document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);
}

document.addEventListener("click",async e=>{
  const b=e.target.closest("[data-a]");
  if(b){const a=b.dataset.a;
    try{
      if(a==="pagar")dlgPagar();
      else if(a==="transf")dlgTransf(b.dataset.de,b.dataset.para,b.dataset.v?Number(b.dataset.v):null);
      else if(a==="conta")dlgConta(b.dataset.id);
      else if(a==="novaconta")dlgEditConta(null);
      else if(a==="novoparcelamento")dlgTpl(null,true);
      else if(a==="pagprev")dlgPagar(b.dataset.id,b.dataset.mes);
      else if(a==="transfprev")dlgTransf(b.dataset.de,b.dataset.para,Number(b.dataset.v),b.dataset.mes);
      else if(a==="rendas")dlgRendas();
      else if(a==="abrir"){b.disabled=true;await abrirMes(b.dataset.id)}
      else if(a==="delpag")await delPag(b.dataset.id);
      else if(a==="tpl")dlgTpl(b.dataset.id);
      else if(a==="moradores")dlgMoradores();
      else if(a==="csv")exportCSV();
      else if(a==="novogrupo")dlgNovoGrupo();
      else if(a==="renomear")dlgRenomear();
      else if(a==="excluirgrupo")dlgExcluirGrupo();
      else if(a==="addpessoa")dlgAddPessoa();
      else if(a==="rmmembro")await removerAcesso(b.dataset.email);
      else if(a==="irajustes"){S.tab="ajustes";render();window.scrollTo(0,0)}
      else if(a==="recarregar"){S.status="loading";render();await entrar(S.session)}
      else if(a==="sair"){await S.sb.auth.signOut();location.reload()}
      else if(a==="voltarlogin"){S.enviado=null;render()}
      else if(a==="modologin"){const f=$("#fLogin");if(f)S.emailLogin=String(new FormData(f).get("email")||"").trim();S.modoLogin=S.modoLogin==="link"?"senha":"link";render()}
      else if(a==="senha"){dlgSenha(false)}
      else if(a==="minhaconta"){dlgMinhaConta()}
    }catch(err){erro(err)}finally{if(a==="abrir"&&b.isConnected)b.disabled=false}
    return;
  }
  const t=e.target.closest(".tabs button");
  if(t){S.tab=t.dataset.tab;render();window.scrollTo(0,0)}
});
document.addEventListener("change",async e=>{
  const s=e.target.closest("select[data-vinculo]");
  if(s){try{await vincular(s.dataset.vinculo,s.value)}catch(err){erro(err)}}
});
$("#gbtn").onclick=()=>dlgGrupos();
$("#prev").onclick=()=>{const ids=Object.keys(S.meses).sort(),i=ids.indexOf(S.mesId);if(i>0){S.mesId=ids[i-1];render()}};
$("#next").onclick=()=>{const ids=Object.keys(S.meses).sort(),i=ids.indexOf(S.mesId);if(i<0)return;if(i<ids.length-1){S.mesId=ids[i+1];render()}else dlgAbrirProx()};

document.addEventListener("toggle",e=>{
  const d=e.target;if(!d.matches||!d.matches("details.sec"))return;
  S.sec[d.dataset.sec]=d.open;try{localStorage.setItem("sec_"+d.dataset.sec,d.open?"1":"0")}catch(err){}
},true);

let toastT;
function toast(msg){let el=$(".toast");if(!el){el=document.createElement("div");el.className="toast";el.setAttribute("role","status");document.body.appendChild(el)}el.textContent=msg;clearTimeout(toastT);toastT=setTimeout(()=>el.remove(),3200)}
function erro(err){
  console.error(err);const m=String(err?.message||"");
  if(/row-level security|permission denied/i.test(m)){toast("Sem permissão para esta ação.");return}
  if(/rate limit/i.test(m)){toast("Muitos pedidos de link. Aguarde alguns minutos.");return}
  if(/duplicate key/i.test(m)){toast("Já existe um registro igual.");return}
  if(/fetch|network/i.test(m)){toast("Sem conexão. Verifique a internet.");return}
  toast("Não foi possível concluir: "+m.slice(0,90));
}

/* ---------- início ---------- */
async function entrar(session){
  S.session=session;
  if(!session){S.status="login";render();return}
  try{
    const adm=await q(S.sb.from("admins").select("email"));
    S.admin=adm.length>0;
    await carregar();
    ouvirMudancas();
    if(S.session)setTimeout(sugerirSenha,400);
  }catch(err){erro(err);S.status="erro";render()}
}
async function init(){
  const incompleto=!CFG.url||!CFG.key||/COLE/i.test(String(CFG.url)+String(CFG.key));
  if(!window.supabase||incompleto){S.status="config";render();return}
  S.sb=window.supabase.createClient(CFG.url,CFG.key);
  render();
  let atual;
  S.sb.auth.onAuthStateChange((ev,session)=>{
    const id=session?.user?.id||null;
    if(id===atual&&ev!=="SIGNED_OUT")return;
    atual=id;setTimeout(()=>entrar(session),0);
  });
}
init();
})();
</script>
