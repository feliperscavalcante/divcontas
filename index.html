<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Contas da casa</title>
<meta name="theme-color" content="#0B0B0C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏠</text></svg>">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<script>try{document.documentElement.setAttribute("data-theme",localStorage.getItem("tema")||"dark")}catch(e){document.documentElement.setAttribute("data-theme","dark")}</script>
<style>
:root{
  --bg:#0B0B0C; --surface:#161617; --sunk:#222224; --ink:#EEEEEF; --muted:#9B9BA1; --line:#2B2B2E;
  --p0:#F08DBA; --p1:#78C8E6;
  --warn:#F4C86A; --warn-bg:#2D2410; --ok:#74D69C; --ok-bg:#14301F; --bad:#F2918A; --bad-bg:#38201E;
  --btn:#8AAEF5; --btn-ink:#0A1633; --accent:#8AAEF5;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="light"]{
  --bg:#F2F3F5; --surface:#FFFFFF; --sunk:#EDEFF2; --ink:#14171C; --muted:#5C6570; --line:#E1E4E9;
  --p0:#A3245F; --p1:#1A6683;
  --warn:#7A4E00; --warn-bg:#FCEFC9; --ok:#1F6B40; --ok-bg:#D9F0E2; --bad:#A8201A; --bad-bg:#FBE1DE;
  --btn:#2F62D6; --btn-ink:#FFFFFF; --accent:#2F62D6; color-scheme:light;
}
@media (prefers-color-scheme: light){
  :root[data-theme="auto"]{
    --bg:#F2F3F5; --surface:#FFFFFF; --sunk:#EDEFF2; --ink:#14171C; --muted:#5C6570; --line:#E1E4E9;
    --p0:#A3245F; --p1:#1A6683;
    --warn:#7A4E00; --warn-bg:#FCEFC9; --ok:#1F6B40; --ok-bg:#D9F0E2; --bad:#A8201A; --bad-bg:#FBE1DE;
    --btn:#2F62D6; --btn-ink:#FFFFFF; --accent:#2F62D6; color-scheme:light;
  }
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;padding-bottom:104px}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:620px;margin:0 auto;padding:0 16px}

/* topo */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:8px;height:56px}
.top h1{flex:1;margin:0;font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:-.01em;text-align:center}
.iconbtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;font-size:18px;line-height:1}
.iconbtn:disabled{opacity:.35;cursor:default}

/* hero do acerto */
.hero{padding:28px 0 20px}
.acerto{font-family:var(--display);font-weight:700;font-size:clamp(28px,7.2vw,40px);line-height:1.08;letter-spacing:-.02em;margin:0 0 10px}
.acerto .v{white-space:nowrap}
.c0{color:var(--p0)} .c1{color:var(--p1)}
.hero p.sub{margin:0;color:var(--muted)}
.hero-acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}

.btn{border:0;border-radius:999px;padding:11px 18px;background:var(--btn);color:var(--btn-ink);font-weight:700;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.btn.small{padding:7px 13px;font-size:14px}
.btn.danger{background:transparent;color:var(--bad);border:1.5px solid var(--bad)}
.link{background:none;border:0;padding:0;color:var(--ink);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:14px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* balança por pessoa */
.balanca{display:grid;gap:14px;padding:18px;background:var(--surface);border-radius:22px;border:1px solid var(--line)}
.pessoa-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.pessoa-top .nome{font-family:var(--display);font-weight:700;font-size:18px;color:var(--c)}
.pessoa-top .parte{font-weight:700}
.barra{height:10px;border-radius:6px;background:var(--sunk);margin:6px 0 5px;overflow:hidden;border:1px solid var(--line)}
.barra span{display:block;height:100%;background:var(--c);border-radius:6px}
.pessoa-sub{display:flex;justify-content:space-between;gap:8px;font-size:14px;color:var(--muted);flex-wrap:wrap}
.rendas{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;color:var(--muted);padding-top:10px;border-top:1px dashed var(--line)}

/* seções */
section{margin-top:28px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:10px}
.sec-h h2{font-family:var(--display);font-weight:700;font-size:21px;margin:0;letter-spacing:-.01em}
.sec-h .meta{color:var(--muted);font-size:14px;text-align:right}

/* lista de contas */
.lista{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:22px;overflow:hidden}
.lista li+li{border-top:1px solid var(--line)}
.conta{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;width:100%;padding:13px 14px;background:none;border:0;text-align:left;cursor:pointer}
.conta:hover{background:var(--sunk)}
.dia{width:44px;height:44px;border-radius:12px;background:var(--sunk);border:1px solid var(--line);display:grid;place-items:center;line-height:1;font-family:var(--display);font-weight:700;font-size:17px}
.dia small{display:block;font-family:var(--body);font-weight:400;font-size:10px;color:var(--muted);margin-bottom:2px}
.conta .nm{font-weight:700;text-transform:capitalize}
.conta .rg{font-size:13px;color:var(--muted)}
.conta .dir{text-align:right}
.conta .vl{font-weight:700}
.chips{display:flex;gap:4px;justify-content:flex-end;flex-wrap:wrap;margin-top:3px}
.chip{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.bad{background:var(--bad-bg);color:var(--bad)}
.lista-foot{display:flex;justify-content:space-between;padding:12px 14px;background:var(--sunk);font-weight:700}

/* movimentos */
.mov{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:11px 14px}
.mov .d{font-size:13px;color:var(--muted)}
.mov .t{font-weight:700}
.mov .x{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:none;cursor:pointer;color:var(--muted)}
.vazio{padding:18px 14px;color:var(--muted);text-align:center}

/* histórico */
.hist-row{display:grid;grid-template-columns:120px 1fr auto;gap:12px;align-items:center;padding:12px 14px}
.hbar{height:12px;border-radius:6px;background:var(--sunk);overflow:hidden;border:1px solid var(--line)}
.hbar span{display:block;height:100%;background:var(--ink);opacity:.75}
.tblwrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:22px}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:460px}
th,td{padding:10px 12px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left;text-transform:capitalize;position:sticky;left:0;background:var(--surface)}
th{font-weight:700;color:var(--muted);font-size:13px}
td.up{color:var(--bad)} td.down{color:var(--ok)}
.nota{font-size:14px;color:var(--muted);margin:10px 2px 0}

/* ajustes */
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px}
.card p{margin:0 0 10px}
.card p:last-child{margin-bottom:0}


.aviso{margin-top:14px;padding:12px 14px;border-radius:14px;background:var(--warn-bg);color:var(--warn);font-size:14px}

/* diálogo */
dialog{border:0;padding:0;border-radius:22px;width:min(520px,calc(100vw - 24px));max-height:calc(100% - 32px);background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.6)}
.dlg{padding:22px 20px 18px;display:grid;gap:14px}
.dlg h3{margin:0;font-family:var(--display);font-size:22px;letter-spacing:-.01em}
.dlg .desc{margin:-6px 0 0;color:var(--muted);font-size:14px}
.campo{display:grid;gap:5px}
.campo span{font-size:14px;font-weight:700}
.campo input,.campo select,.campo textarea{width:100%;padding:11px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--sunk)}
.campo input:focus,.campo select:focus{border-color:var(--ink);outline:none}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check{display:flex;gap:8px;align-items:center;font-size:15px}
.dlg-act{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:4px}
.dlg-act .esq{margin-right:auto}
.det{display:grid;gap:6px;padding:12px;border-radius:12px;background:var(--sunk);font-size:15px}
.det div{display:flex;justify-content:space-between;gap:8px}

.toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:700;z-index:20;max-width:calc(100vw - 32px)}
.estado{padding:60px 8px;text-align:center;color:var(--muted)}
.login{max-width:380px;margin:0 auto;text-align:left;display:grid;gap:12px}
.estado h2{font-family:var(--display);color:var(--ink);margin:0 0 8px}
@media (prefers-reduced-motion:no-preference){ .barra span{transition:width .4s ease} }
.glist{display:grid;gap:8px}
.gopt{width:100%;text-align:left;padding:14px;border-radius:14px;border:1.5px solid var(--line);background:var(--sunk);cursor:pointer;font-weight:700}
.gopt[aria-current="true"]{border-color:var(--ink);background:var(--surface)}
.pr{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:start;padding:12px 14px}
.pr .em{font-weight:700;word-break:break-all}
.pr select{margin-top:6px;width:100%;padding:9px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--sunk)}
.pend{margin:0 0 14px;border:1px solid var(--warn);border-left:6px solid var(--warn);border-radius:14px;background:var(--warn-bg);color:var(--ink)}
.pend summary{list-style:none;cursor:pointer;display:block;position:relative;padding:10px 40px 10px 52px;font-size:14px}
.pend summary::-webkit-details-marker{display:none}
.pend summary::before{content:"!";position:absolute;left:12px;top:50%;transform:translateY(-50%);width:28px;height:28px;border-radius:50%;background:var(--warn);color:var(--warn-bg);font-weight:800;font-size:17px;line-height:28px;text-align:center}
.pend summary::after{content:"\25BE";position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:14px;color:var(--warn)}
.pend[open] summary::after{content:"\25B4"}
.pend .pt{display:block;font-weight:700;color:var(--warn)}
.pend .ps{display:block;color:var(--ink)}
.pend .nb{white-space:nowrap}
.pend li button>.num{flex:none;white-space:nowrap;font-weight:700}
.pend li button>span:first-child{min-width:0;overflow-wrap:anywhere}
.pend{overflow:hidden}
.pend ul{list-style:none;margin:0;padding:0 8px 6px}
.pend li{min-width:0}
.pend li button{box-sizing:border-box;max-width:100%}
.pend li button{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;padding:10px 8px;background:none;border:0;border-top:1px solid var(--warn);border-radius:0;cursor:pointer;text-align:left;font-size:14px;color:var(--ink)}
.pend li button:hover{background:var(--surface)}
.pend li button small{display:block;color:var(--muted);font-size:12px}
.nota{overflow-wrap:anywhere}
details.sec>summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:22px;min-height:24px}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary h2{font-family:var(--display);font-weight:700;font-size:19px;margin:0;letter-spacing:-.01em}
details.sec>summary .meta{margin-left:auto;color:var(--muted);font-size:14px;text-align:right}
details.sec>summary::after{content:"\25BE";color:var(--muted);font-size:15px;flex:none}
details.sec[open]>summary::after{content:"\25B4"}
details.sec[open]>summary{margin-bottom:10px}
details.sec>summary:hover{border-color:var(--ink)}

[hidden]{display:none!important}
/* novo estilo: topo */
.top{border-bottom:0;background:var(--bg)}
.top .wrap{height:60px;gap:2px;position:relative}
.top .mes{flex:1;display:flex;align-items:center;justify-content:center;gap:2px;min-width:0}
.top h1{flex:0 1 auto;min-width:0;font-family:var(--body);font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top h1.mes-ativo{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:6px}
.iconbtn.flat{border:0;background:transparent;width:44px;height:44px;flex:none;font-size:26px;color:var(--ink)}
.iconbtn.flat:hover{background:var(--sunk)}
.iconbtn svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.iconbtn svg circle{fill:currentColor;stroke:none}
.gsub{text-align:center;font-size:12px;color:var(--muted);margin:-10px 0 4px}
.pop{position:absolute;right:12px;top:54px;min-width:230px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:6px;box-shadow:0 10px 30px rgba(0,0,0,.45);z-index:8}
.pop button{display:block;width:100%;text-align:left;padding:12px 14px;border:0;background:transparent;border-radius:10px;font-weight:700;cursor:pointer;color:var(--ink)}
.pop button:hover{background:var(--sunk)}

/* resumo do mês */
.resumo{display:grid;justify-items:center;gap:2px;padding:10px 0 6px;text-align:center}
.resumo>small{color:var(--muted);font-size:15px}
.resumo>strong{font-family:var(--display);font-weight:700;font-size:clamp(34px,10vw,46px);line-height:1.05;letter-spacing:-.02em;white-space:nowrap}
.rchips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:10px}
.rchip{background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;color:var(--muted);white-space:nowrap}
.rchip b{color:var(--ink);font-weight:700}
.status{background:var(--surface);border-radius:24px;padding:20px 18px;text-align:center;margin-top:14px}
.status .acerto{font-size:clamp(22px,6.2vw,30px);margin:0 0 8px}
.status p.sub{margin:0;color:var(--muted)}
.status .btn{margin-top:14px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.pc{background:var(--surface);border-radius:24px;padding:16px;display:grid;gap:3px;align-content:start;min-width:0}
.pc .ico{width:40px;height:40px;border-radius:50%;background:var(--c);color:var(--bg);display:grid;place-items:center;font-weight:800;margin-bottom:6px}
.pc .pnome{color:var(--c);font-weight:700}
.pc .pval{font-family:var(--display);font-weight:700;font-size:24px;white-space:nowrap}
.pc .psub{font-size:13px;color:var(--muted)}
.pc .barra{margin:8px 0 6px}
.rendas{margin-top:12px;background:var(--surface);border-radius:22px;padding:14px 16px;border-top:0}
.pend{margin-top:14px}
.balanca{margin-top:14px}

/* botao flutuante */
.fab{position:fixed;right:max(18px,calc((100vw - 620px)/2 + 18px));bottom:calc(20px + env(safe-area-inset-bottom,0px));width:62px;height:62px;border-radius:50%;border:0;background:var(--accent);color:var(--btn-ink);display:grid;place-items:center;box-shadow:0 8px 22px rgba(0,0,0,.5);cursor:pointer;z-index:6}
.fab svg{width:28px;height:28px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round}
.toast{bottom:calc(100px + env(safe-area-inset-bottom,0px))}
.sheet{display:grid;gap:8px}
.sheetopt{display:block;width:100%;padding:16px;border-radius:16px;border:0;background:var(--sunk);font-weight:700;font-size:16px;text-align:left;cursor:pointer;color:var(--ink)}
.sheetopt small{display:block;font-weight:400;color:var(--muted);font-size:13px;margin-top:2px}
.sheetopt:hover{outline:2px solid var(--accent)}

/* menu lateral */
dialog#drawer{margin:0;padding:0;inset:0 auto 0 0;height:100dvh;max-height:none;width:min(86vw,340px);border-radius:0 28px 28px 0;background:var(--bg);color:var(--ink);overflow-y:auto}
dialog#drawer[open]{animation:slidein .2s ease-out}
@keyframes slidein{from{transform:translateX(-100%)}}
@media (prefers-reduced-motion:reduce){dialog#drawer[open]{animation:none}}
.dr{display:flex;flex-direction:column;min-height:100%;padding:calc(20px + env(safe-area-inset-top,0px)) 12px calc(14px + env(safe-area-inset-bottom,0px))}
.dr:focus{outline:none}
.dr-head{display:flex;gap:14px;align-items:center;padding:4px 8px 18px}
.avatar{width:56px;height:56px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:800;font-size:22px;background:var(--surface);border:2px solid var(--accent);color:var(--ink)}
.dr-id{min-width:0}
.dr-id strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dr-id small{display:block;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{display:inline-block;margin-top:6px;padding:3px 12px;border-radius:999px;border:1px solid var(--warn);color:var(--warn);font-size:12px;font-weight:700}
.dr-item{display:flex;align-items:center;gap:16px;width:100%;padding:14px 16px;border:0;border-radius:999px;background:transparent;font-weight:700;font-size:16px;text-align:left;cursor:pointer;color:var(--ink)}
.dr-item:hover:not(:disabled){background:var(--sunk)}
.dr-item[aria-current="page"]{background:var(--surface)}
.dr-item:disabled{cursor:default;opacity:1}
.dr-item svg{width:22px;height:22px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.dr-item span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dr-item .dr-chev{flex:none;color:var(--muted)}
#gbtn:disabled .dr-chev{display:none}
.dr-sec{margin:18px 16px 6px;color:var(--muted);font-size:14px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin:0 4px;padding:4px;background:var(--surface);border-radius:999px}
.seg button{border:0;background:transparent;padding:9px 4px;border-radius:999px;font-weight:700;font-size:14px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--sunk);color:var(--ink)}
.dr-foot{margin-top:auto;padding-top:14px}
.dr-item.sair{color:var(--bad)}
.slbox{display:grid;gap:8px;margin:2px 0 4px}
.slends{display:flex;justify-content:space-between;gap:10px;font-size:14px;font-weight:700}
.slends span{min-width:0;display:grid;gap:1px}
.slends span:last-child{text-align:right}
.slends small{font-weight:400;color:var(--muted);font-size:13px}
.slider{width:100%;height:36px;margin:0;accent-color:var(--accent);cursor:pointer;touch-action:pan-y}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <button class="iconbtn flat" id="menu" type="button" aria-label="Abrir menu" aria-haspopup="dialog"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  <div class="mes">
    <button class="iconbtn flat" id="prev" aria-label="Mês anterior">‹</button>
    <h1 id="titulo">Contas da casa</h1>
    <button class="iconbtn flat" id="next" aria-label="Próximo mês">›</button>
  </div>

<script>
(function(){
"use strict";
const CFG=window.CONTAS_CONFIG||{};
function lerSec(){const o={contas:false,mov:false};try{for(const k in o)o[k]=localStorage.getItem("sec_"+k)==="1"}catch(e){}return o}
const S={sb:null,session:null,admin:false,status:"loading",grupos:[],membros:[],grupoId:null,mesGrupo:null,
  config:null,meses:{},todosPags:[],mesId:null,tab:"mes",enviado:null,modoLogin:"senha",seq:0,sec:lerSec()};
const MESES=["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
const fmt=new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"});
const brl=c=>fmt.format((c||0)/100);
const pctf=x=>(x*100).toLocaleString("pt-BR",{maximumFractionDigits:1})+"%";
const mesNome=id=>{const [y,m]=id.split("-").map(Number);return MESES[m-1]+" de "+y};
const mesCurto=id=>{const [y,m]=id.split("-").map(Number);return MESES[m-1].slice(0,3)+"/"+String(y).slice(2)};
const nextId=id=>{let [y,m]=id.split("-").map(Number);m++;if(m>12){m=1;y++}return y+"-"+String(m).padStart(2,"0")};
const prevId=id=>{let [y,m]=id.split("-").map(Number);m--;if(m<1){m=12;y--}return y+"-"+String(m).padStart(2,"0")};
const mesIdx=id=>{const [y,m]=id.split("-").map(Number);return y*12+(m-1)};
const idxMes=n=>Math.floor(n/12)+"-"+String(n%12+1).padStart(2,"0");
const somaMeses=(id,n)=>idxMes(mesIdx(id)+n);
const hoje=()=>new Date();
const hojeId=()=>{const d=hoje();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")};
const hojeISO=()=>{const d=hoje();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const dataBR=iso=>{if(!iso)return"";const [y,m,d]=String(iso).slice(0,10).split("-");return d+"/"+m};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const EMAIL=/^[^\s@]+@[^\s@]+\.[^\s@]+$/;
function parseBRL(str){let s=String(str??"").replace(/R\$|\s/g,"");if(!s)return NaN;if(s.includes(","))s=s.replace(/\./g,"").replace(",",".");const n=Number(s);return isFinite(n)?Math.round(n*100):NaN}
const toInput=c=>((c||0)/100).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
const slug=s=>(String(s).normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"conta")+"-"+Math.random().toString(36).slice(2,6);
const slugSimples=s=>String(s).normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"casa";

const $=s=>document.querySelector(s);
const app=$("#app"),dlg=$("#dlg");

/* ---------- atalhos de estado ---------- */
const pessoas=()=>S.config?.moradores||[];
const nomeDe=id=>pessoas().find(p=>p.id===id)?.nome||id;
const corDe=id=>"c"+Math.max(0,pessoas().findIndex(p=>p.id===id));
const varCor=i=>"var(--p"+(i%2)+")";
const pagsMes=()=>S.todosPags.filter(p=>p.mes===S.mesId);
const emailMeu=()=>String(S.session?.user?.email||"").toLowerCase();
const grupoAtual=()=>S.grupos.find(g=>g.id===S.grupoId)||null;
const membrosDoGrupo=()=>S.membros.filter(m=>m.grupo_id===S.grupoId);
const souMembro=()=>membrosDoGrupo().some(m=>m.email===emailMeu());
const meuMorador=()=>membrosDoGrupo().find(m=>m.email===emailMeu())?.morador_id||null;
const salvarGrupo=id=>{try{localStorage.setItem("contas.grupo",id||"")}catch(e){}};
const lerGrupo=()=>{try{return localStorage.getItem("contas.grupo")||null}catch(e){return null}};

function regraTxt(c){
  if(c.regra==="igual")return pessoas().length===2?"meio a meio":"partes iguais";
  if(c.regra==="proporcional")return "pela renda";
  return pessoas().map(p=>(c.pct?.[p.id]??0)+"%").join(" / ");
}

const parcelaTxt=c=>c.parcela&&c.parcelas?"parcela "+c.parcela+" de "+c.parcelas:"";
/* Parcela que cai em um mês para um parcelamento, ou null se o mês está fora do período */
function parcelaDoMes(t,mesId){
  if(!t.parcelas||!t.inicio)return null;
  const n=mesIdx(mesId)-mesIdx(t.inicio)+1;
  return n>=1&&n<=t.parcelas?n:null;
}

/* ---------- banco de dados ---------- */
async function q(promessa){const {data,error}=await promessa;if(error)throw error;return data}
async function carregar(){
  const sb=S.sb,seq=++S.seq;
  const [gr,mb]=await Promise.all([
    q(sb.from("grupos").select("*").order("criado_em")),
    q(sb.from("grupo_membros").select("*"))
  ]);
  if(seq!==S.seq)return;
  S.grupos=gr;S.membros=mb;
  if(!S.grupos.some(g=>g.id===S.grupoId)){
    const salvo=lerGrupo();
    S.grupoId=S.grupos.some(g=>g.id===salvo)?salvo:(S.grupos[0]?.id||null);
  }
  if(S.mesGrupo!==S.grupoId){S.mesId=null;S.mesGrupo=S.grupoId}
  if(!S.grupoId){S.config=null;S.meses={};S.todosPags=[];S.status="ok";render();return}
  const gid=S.grupoId;
  const [mor,rec,mes,cm,pg]=await Promise.all([
    q(sb.from("moradores").select("*").eq("grupo_id",gid).order("ordem")),
    q(sb.from("contas_recorrentes").select("*").eq("grupo_id",gid)),
    q(sb.from("meses").select("*").eq("grupo_id",gid)),
    q(sb.from("contas_mes").select("*").eq("grupo_id",gid)),
    q(sb.from("pagamentos").select("*").eq("grupo_id",gid))
  ]);
  if(seq!==S.seq)return;
  S.config={moradores:mor.map(x=>({id:x.id,nome:x.nome})),contas:rec.map(x=>({id:x.id,nome:x.nome,dia:x.dia,regra:x.regra,pct:x.pct,valorPadrao:x.valor_padrao,parcelas:x.parcelas||null,inicio:x.inicio||null}))};
  const m={};mes.forEach(x=>m[x.id]={rendas:x.rendas||{},contas:{}});
  cm.forEach(x=>{if(m[x.mes_id])m[x.mes_id].contas[x.conta_id]={nome:x.nome,dia:x.dia,regra:x.regra,pct:x.pct,valor:x.valor,estimado:x.estimado,parcela:x.parcela||null,parcelas:x.parcelas||null}});
  S.meses=m;projetar();
  S.todosPags=pg.map(x=>({id:x.id,mes:x.mes_id,tipo:x.tipo,contaId:x.conta_id,quem:x.quem,de:x.de,para:x.para,valor:x.valor,data:x.data,obs:x.obs}));
  const ids=Object.keys(m).sort();
  if(!S.mesId||!m[S.mesId])S.mesId=m[hojeId()]?hojeId():ids[ids.length-1]||null;
  S.status="ok";render();
}
let recargaT;
function agendarRecarga(){clearTimeout(recargaT);recargaT=setTimeout(()=>carregar().catch(erro),400)}
let canal=null;
function ouvirMudancas(){
  if(canal)return;
  canal=S.sb.channel("casa").on("postgres_changes",{event:"*",schema:"public"},agendarRecarga).subscribe();
}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&S.status==="ok")agendarRecarga()});

/* ---------- cálculo ---------- */
function calc(mes,pags){
  const ps=pessoas(),rendas=mes.rendas||{};
  const rendaTotal=ps.reduce((a,p)=>a+(rendas[p.id]||0),0);
  const devido={},pago={},pagoConta={};
  ps.forEach(p=>{devido[p.id]=0;pago[p.id]=0});
  for(const g of pags){
    if(g.tipo==="conta"){pago[g.quem]=(pago[g.quem]||0)+g.valor;pagoConta[g.contaId]=(pagoConta[g.contaId]||0)+g.valor}
    else if(g.tipo==="transferencia"){pago[g.de]=(pago[g.de]||0)+g.valor;pago[g.para]=(pago[g.para]||0)-g.valor}
  }
  const contas=Object.entries(mes.contas||{}).map(([id,c])=>{
    const w=ps.map(p=>c.regra==="igual"?1:c.regra==="proporcional"?(rendas[p.id]||0):(Number(c.pct?.[p.id])||0));
    const sw=w.reduce((a,b)=>a+b,0);
    const partes={};let acc=0;
    ps.forEach((p,i)=>{const v=i===ps.length-1?c.valor-acc:(sw?Math.round(c.valor*w[i]/sw):Math.round(c.valor/ps.length));partes[p.id]=v;acc+=v;devido[p.id]+=v});
    const pc=pagoConta[id]||0;
    const status=c.valor<=0?"semvalor":pc>=c.valor?"pago":pc>0?"parcial":"pendente";
    return Object.assign({id},c,{partes,pagoConta:pc,status});
  }).sort((a,b)=>(a.dia-b.dia)||String(a.nome).localeCompare(b.nome));
  const total=contas.reduce((a,c)=>a+c.valor,0);
  const falta=contas.reduce((a,c)=>a+Math.max(0,c.valor-c.pagoConta),0);
  const saldo={};ps.forEach(p=>saldo[p.id]=pago[p.id]-devido[p.id]);
  let devedor=null,credor=null;
  ps.forEach(p=>{if(saldo[p.id]<0&&(!devedor||saldo[p.id]<saldo[devedor]))devedor=p.id;if(saldo[p.id]>0&&(!credor||saldo[p.id]>saldo[credor]))credor=p.id});
  const acerto=devedor&&credor?Math.min(-saldo[devedor],saldo[credor]):0;
  return {ps,rendas,rendaTotal,contas,total,falta,devido,pago,saldo,devedor,credor,acerto};
}
function prazo(c,mesId){
  if(c.status==="pago"||c.status==="semvalor")return null;
  const atual=hojeId();
  if(mesId<atual)return{cls:"bad",txt:"Atrasada"};
  if(mesId>atual)return null;
  const diff=c.dia-hoje().getDate();
  if(diff<0)return{cls:"bad",txt:"Atrasada"};
  if(diff===0)return{cls:"warn",txt:"Pagar hoje"};
  if(diff<=3)return{cls:"warn",txt:"Pagar em "+diff+(diff===1?" dia":" dias")};
  return null;
}
const STATUS={pago:["ok","Paga"],parcial:["warn","Parcial"],pendente:["","Pendente"],semvalor:["","Sem valor"]};

/* ---------- telas ---------- */
function render(){
  const temAcesso=S.status==="ok"&&(S.grupos.length>0||S.admin);
  const g=grupoAtual();
  const mostraAbas=temAcesso&&!!g;
  const membro=mostraAbas&&souMembro()&&pessoas().length>0;
  const ids=Object.keys(S.meses).sort(),i=ids.indexOf(S.mesId),naMes=mostraAbas&&S.tab==="mes"&&membro,temMes=!!(naMes&&S.mesId&&S.meses[S.mesId]);
  $("#menu").style.visibility=mostraAbas?"visible":"hidden";
  $("#mais").style.visibility=temMes?"visible":"hidden";
  if(!temMes)fecharMais();
  $("#fab").hidden=!temMes;
  $("#prev").disabled=!naMes||i<=0;$("#next").disabled=!naMes||i<0||i>=ids.length-1;
  $("#prev").style.visibility=$("#next").style.visibility=naMes?"visible":"hidden";
  $("#titulo").textContent=naMes&&S.mesId?mesNome(S.mesId):mostraAbas&&S.tab==="hist"?"Histórico":mostraAbas&&S.tab==="ajustes"?"Ajustes":"Contas da casa";
  $("#titulo").classList.toggle("mes-ativo",!!(naMes&&S.mesId));
  const gsub=$("#gsub");gsub.hidden=!(naMes&&g&&S.grupos.length>1);if(!gsub.hidden)gsub.textContent=g.nome;
  atualizarDrawer(g);

  if(S.status==="config"){app.innerHTML=`<div class="estado"><h2>Falta configurar</h2><p>Crie no repositório um arquivo chamado <strong>config.js</strong> com a Project URL e a chave pública do Supabase.</p></div>`;return}
  if(S.status==="loading"){app.innerHTML=`<div class="estado">Carregando…</div>`;return}
  if(S.status==="erro"){app.innerHTML=`<div class="estado"><h2>Não foi possível carregar</h2><p>Verifique a internet e tente de novo. Se o problema continuar, o banco pode não ter sido atualizado.</p><button class="btn" data-a="recarregar">Tentar de novo</button></div>`;return}
  if(S.status==="login"){renderLogin();return}
  if(!temAcesso){renderSemAcesso();return}
  if(!g){renderSemGrupo();return}
  if(S.tab==="ajustes"){renderAjustes();return}
  if(!souMembro()){renderNaoMembro();return}
  if(!pessoas().length){renderSemPessoas();return}
  if(S.tab==="mes")renderMes();else renderHist();
}
function renderLogin(){
  if(S.enviado){app.innerHTML=`<div class="estado"><h2>Confira seu e-mail</h2><p>Enviamos um link de acesso para <strong>${esc(S.enviado)}</strong>. Abra o link neste mesmo aparelho e navegador. Ao entrar, você poderá definir uma senha.</p><button class="link" data-a="voltarlogin">Voltar</button></div>`;return}
  const link=S.modoLogin==="link";
  app.innerHTML=`<div class="estado"><form class="login" id="fLogin"><h2>Contas da casa</h2>
    <p style="margin:0">${link?"Informe o seu e-mail. Você recebe um link de acesso e, depois de entrar, define uma senha para os próximos acessos.":"Entre com o seu e-mail e a sua senha."}</p>
    <label class="campo"><span>E-mail</span><input type="email" name="email" required autocomplete="username" value="${esc(S.emailLogin||"")}"></label>
    ${link?"":`<label class="campo"><span>Senha</span><input type="password" name="senha" required autocomplete="current-password"></label>`}
    <button class="btn">${link?"Receber link de acesso":"Entrar"}</button>
    <p style="margin:6px 0 0"><button type="button" class="link" data-a="modologin">${link?"Já tenho senha":"Primeiro acesso ou esqueci a senha"}</button></p></form></div>`;
  $("#fLogin").addEventListener("submit",async e=>{
    e.preventDefault();const b=e.target.querySelector("button.btn");b.disabled=true;
    const fd=new FormData(e.target),email=String(fd.get("email")).trim();S.emailLogin=email;
    try{
      if(link){await q(S.sb.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+location.pathname}}));S.enviado=email;render()}
      else await q(S.sb.auth.signInWithPassword({email,password:String(fd.get("senha"))}));
    }catch(err){
      if(!link&&/invalid login credentials/i.test(String(err?.message||""))){toast("E-mail ou senha incorretos. Se ainda não definiu uma senha, use \"Primeiro acesso\".")}
      else erro(err);
      b.disabled=false}
  });
}
function renderSemAcesso(){
  app.innerHTML=`<div class="estado"><h2>E-mail sem acesso</h2><p>${esc(emailMeu())} ainda não foi adicionado a nenhum grupo. Peça ao administrador para incluir este e-mail e toque em verificar.</p>
  <div class="hero-acts" style="justify-content:center"><button class="btn" data-a="recarregar">Verificar de novo</button><button class="btn ghost" data-a="sair">Entrar com outro e-mail</button></div></div>`;
}
function renderSemGrupo(){
  app.innerHTML=`<div class="estado"><h2>Nenhum grupo ainda</h2><p>Crie o primeiro grupo de divisão de despesas.</p><button class="btn" data-a="novogrupo">Criar grupo</button>
  <p style="margin-top:18px"><button class="link" data-a="sair">Sair</button></p></div>`;
}
function renderNaoMembro(){
  app.innerHTML=`<div class="estado"><h2>Você administra este grupo</h2><p>Seu e-mail não está entre as pessoas dele, por isso os valores ficam ocultos para você. Se quiser participar, adicione-se em Ajustes.</p><button class="btn" data-a="irajustes">Abrir ajustes</button></div>`;
}
function renderSemPessoas(){
  app.innerHTML=`<div class="estado"><h2>Grupo sem pessoas</h2><p>${S.admin?"Adicione as pessoas que dividem as despesas em Ajustes.":"Peça ao administrador para adicionar as pessoas deste grupo."}</p>${S.admin?`<button class="btn" data-a="irajustes">Abrir ajustes</button>`:""}</div>`;
}

/* Contas em aberto e acerto pendente do mês anterior. Só informativo: não altera o cálculo do mês atual. */
function pendenciasAnteriores(){
  const pid=prevId(S.mesId),pm=S.meses[pid];
  if(!pm||pm.virtual||pid>hojeId())return null;
  const pr=calc(pm,S.todosPags.filter(p=>p.mes===pid));
  const contas=pr.contas.filter(c=>c.status==="pendente"||c.status==="parcial")
    .map(c=>({id:c.id,nome:c.nome,dia:c.dia,falta:c.valor-c.pagoConta,parcial:c.status==="parcial",parcela:parcelaTxt(c)}));
  const acerto=pr.acerto>0?{de:pr.devedor,para:pr.credor,valor:pr.acerto}:null;
  if(!contas.length&&!acerto)return null;
  return {mesId:pid,contas,acerto,total:contas.reduce((a,c)=>a+c.falta,0)};
}
function htmlPendencias(){
  const p=pendenciasAnteriores();if(!p)return "";
  const partes=[];
  if(p.contas.length)partes.push(`<span class="nb">${p.contas.length+(p.contas.length===1?" despesa":" despesas")} (${brl(p.total)})</span>`);
  if(p.acerto)partes.push(`<span class="nb">acerto de ${brl(p.acerto.valor)}</span>`);
  const itens=p.contas.map(c=>`<li><button type="button" data-a="pagprev" data-mes="${p.mesId}" data-id="${esc(c.id)}"><span>${esc(c.nome)}<small>${c.parcela?esc(c.parcela)+", ":""}pagamento dia ${c.dia}${c.parcial?", paga em parte":""}</small></span><span class="num">${brl(c.falta)}</span></button></li>`).join("")
    +(p.acerto?`<li><button type="button" data-a="transfprev" data-mes="${p.mesId}" data-de="${esc(p.acerto.de)}" data-para="${esc(p.acerto.para)}" data-v="${p.acerto.valor}"><span>Acerto<small>${esc(nomeDe(p.acerto.de))} para ${esc(nomeDe(p.acerto.para))}</small></span><span class="num">${brl(p.acerto.valor)}</span></button></li>`:"");
  return `<details class="pend"><summary><span class="pt">Pendências de ${MESES[+p.mesId.slice(5)-1]}</span><span class="ps num">${partes.join(" e ")}</span></summary><ul>${itens}</ul></details>`;
}

function renderMes(){
  const ids=Object.keys(S.meses).sort();
  if(!S.mesId||!S.meses[S.mesId]){

      <div class="psub num">${rd?pctf(dv/rd)+" da renda":"renda não informada"}</div></div>`;

  const rendasTxt=r.ps.map(p=>esc(p.nome)+" "+brl(r.rendas[p.id]||0)).join(", ");

      </span></span></button></li>`;

  const movs=pags.slice().sort((a,b)=>String(b.data).localeCompare(String(a.data))).map(g=>{
    const t=g.tipo==="conta"?`${esc(nomeDe(g.quem))} pagou ${esc(mes.contas?.[g.contaId]?.nome||"despesa")}`:`${esc(nomeDe(g.de))} transferiu para ${esc(nomeDe(g.para))}`;

    <ul class="lista">${lis||`<li class="vazio">Nenhuma despesa neste mês.</li>`}<li class="lista-foot num"><span>Total</span><span>${brl(r.total)}</span></li></ul>
    <p style="margin:10px 2px 0"><button class="link" data-a="novaconta">Adicionar despesa só neste mês</button> &nbsp;·&nbsp; <button class="link" data-a="novoparcelamento">Parcelar uma compra</button></p></details></section>

function renderHist(){
  const ids=Object.keys(S.meses).filter(x=>!S.meses[x].virtual).sort();
  if(!ids.length){app.innerHTML=`<div class="estado"><h2>Sem histórico</h2><p>Abra um mês para começar.</p></div>`;return}
  const tot=ids.map(id=>{const c=Object.values(S.meses[id].contas||{});const t=c.reduce((a,x)=>a+(x.valor||0),0);const rd=Object.values(S.meses[id].rendas||{}).reduce((a,b)=>a+b,0);return{id,t,rd,est:c.some(x=>x.estimado)}});
  const max=Math.max(1,...tot.map(x=>x.t));
  const rows=tot.slice().reverse().map(x=>`<li class="hist-row"><span><strong>${MESES[+x.id.slice(5)-1]}</strong> ${x.id.slice(0,4)}${x.est?`<br><span class="chip warn">Tem estimativas</span>`:""}</span>
    <span class="hbar"><span style="width:${x.t/max*100}%"></span></span>
    <span class="num" style="text-align:right">${brl(x.t)}<br><small style="color:var(--muted)">${x.rd?pctf(x.t/x.rd)+" da renda":""}</small></span></li>`).join("");
  const ult=ids.slice(-6),nomes={};
  ult.forEach(id=>Object.entries(S.meses[id].contas||{}).forEach(([cid,c])=>{nomes[cid]=c.nome}));
  const linhas=Object.keys(nomes).map(cid=>{
    const vals=ult.map(id=>S.meses[id].contas?.[cid]);
    const conf=vals.slice(0,-1).filter(v=>v&&!v.estimado&&v.valor>0).map(v=>v.valor);
    const last=vals[vals.length-1];let varTd="<td>sem base</td>";
    if(last&&conf.length&&last.valor>0){const media=conf.reduce((a,b)=>a+b,0)/conf.length;const d=(last.valor-media)/media;varTd=`<td class="${d>0.1?"up":d<-0.1?"down":""}">${d>0?"+":""}${pctf(d)}</td>`}
    return `<tr><td>${esc(nomes[cid])}</td>${vals.map(v=>`<td class="num">${v?brl(v.valor)+(v.estimado?"*":""):"sem despesa"}</td>`).join("")}${varTd}</tr>`;
  }).join("");
  app.innerHTML=`<section><div class="sec-h"><h2>Total por mês</h2></div><ul class="lista">${rows}</ul></section>
  <section><div class="sec-h"><h2>Por despesa</h2></div>
  <div class="tblwrap"><table><thead><tr><th>Despesa</th>${ult.map(id=>`<th>${mesCurto(id)}</th>`).join("")}<th>Último x média</th></tr></thead><tbody class="num">${linhas}</tbody></table></div>
  <p class="nota">* valor estimado. A última coluna compara o mês mais recente com a média dos meses anteriores já confirmados. Vermelho indica alta de mais de 10%.</p></section>
  <section><div class="card"><p><strong>Exportar dados</strong></p><p>Gera um arquivo CSV com todas as despesas e movimentos, que abre no Excel ou no Google Planilhas.</p><button class="btn small" data-a="csv">Baixar CSV</button></div></section>`;
}

  if(!onSubmit)return;if(btn)btn.disabled=true;
  try{const r=await onSubmit(fd,act);if(r!==false){dlg.close();await carregar()}}
  catch(err){erro(err)}finally{if(btn)btn.disabled=false}

function dlgNovoGrupo(){
  if(!S.admin)return;
  const bloco=(n,email)=>`<div class="duo">${campo("Pessoa "+n+": nome",`<input name="n${n}" required maxlength="30">`)}${campo("Pessoa "+n+": e-mail",`<input name="e${n}" type="email" required value="${esc(email)}" autocomplete="off">`)}</div>`;

function dlgPagar(contaId,mesId){
  mesId=mesId||S.mesId;
  const mes=S.meses[mesId],r=calc(mes,S.todosPags.filter(p=>p.mes===mesId));
  const ordem=r.contas.slice().sort((a,b)=>(a.status==="pago")-(b.status==="pago"));
  const sel=contaId||ordem.find(c=>c.status!=="pago")?.id||ordem[0]?.id;
  if(!sel){toast("Adicione uma despesa antes.");return}
  const rest=id=>{const c=r.contas.find(x=>x.id===id);return c?Math.max(0,c.valor-c.pagoConta)||c.valor:0};
  openDlg("Registrar pagamento",mesId===S.mesId?"Quem pagou a despesa direto ao fornecedor.":"Despesa de "+mesNome(mesId)+". O pagamento fica registrado nesse mês.",
    campo("Despesa",`<select name="conta" id="selConta">${ordem.map(c=>`<option value="${esc(c.id)}" ${c.id===sel?"selected":""}>${esc(c.nome)} (${brl(c.valor)})${c.status==="pago"?", já paga":""}</option>`).join("")}</select>`)+
    `<div class="duo">${campo("Quem pagou",`<select name="quem">${optP(meuMorador()||pessoas()[0]?.id)}</select>`)}${campo("Valor (R$)",valInput("valor",rest(sel)))}</div>`+
    `<div class="duo">${campo("Data",`<input type="date" name="data" required value="${hojeISO()}">`)}${campo("Observação",`<input name="obs" maxlength="80" placeholder="opcional">`)}</div>`,
    cancelar+`<button class="btn" value="ok">Registrar</button>`,
    async fd=>{const v=parseBRL(fd.get("valor"));if(!needVal(v))return false;

function lerConta(fd){
  const ps=pessoas(),regra=fd.get("regra");let pct=null;
  if(regra==="custom"){pct={};let s=0;ps.forEach(p=>{pct[p.id]=Number(fd.get("pct_"+p.id))||0;s+=pct[p.id]});if(ps.some(p=>pct[p.id]<0)){toast("Os percentuais não podem ser negativos.");return null}if(Math.abs(s-100)>0.01){toast("Os percentuais precisam somar 100%.");return null}}
  const dp=String(fd.get("data_pag")||""),dia=Math.min(31,Math.max(1,dp?parseInt(dp.slice(8,10))||1:parseInt(fd.get("dia"))||1));
  return {nome:String(fd.get("nome")).trim().toLowerCase(),dia,regra,pct};
}
function bindRegra(){
  const ps=pessoas(),box=$("#pctBox"),vEl=$('#dlg [name="valor"]');
  const P=id=>box.querySelector('[name="pct_'+id+'"]'),R=id=>box.querySelector('[name="rs_'+id+'"]');
  const T=()=>{const v=parseBRL(vEl?vEl.value:"");return isNaN(v)||v<0?0:v};
  const fp=x=>String(Math.round(x*10000)/10000),pv=id=>Math.max(0,Number(P(id).value)||0);
  const cents=(id,t)=>Math.round(t*pv(id)/100);
  const SL=id=>box.querySelector('[name="sl_'+id+'"]');
  const sliderIds=ps.length===2?[ps[0]]:ps.length>2?ps:[];
  function syncSl(){
    sliderIds.forEach(p=>{const el=SL(p.id);if(el)el.value=String(Math.min(100,pv(p.id)))});
    if(ps.length===2){
      const t=T(),a=pv(ps[0].id),b=pv(ps[1].id);
      $("#slA").innerHTML="<b>"+esc(ps[0].nome)+" "+fp(a)+"%</b>"+(t>0?"<small>R$ "+toInput(cents(ps[0].id,t))+"</small>":"");
      $("#slB").innerHTML="<b>"+fp(b)+"% "+esc(ps[1].nome)+"</b>"+(t>0?"<small>R$ "+toInput(cents(ps[1].id,t))+"</small>":"");
    }
  }
  function dica(alvo){
    const t=T();
    $("#pctHint").textContent=!ps.length?"":t>0?(alvo?"Digite em % ou em R$. O restante vai para "+alvo.nome+": "+fp(pv(alvo.id))+"% (R$ "+toInput(cents(alvo.id,t))+").":"Digite em % ou em R$."):"Para digitar em reais, informe antes o valor da despesa. Por enquanto vale o percentual.";
  }
  function tudo(){const t=T();ps.forEach(p=>{R(p.id).disabled=t<=0;R(p.id).value=t>0?toInput(cents(p.id,t)):""});dica(null);syncSl()}
  function resto(from){
    if(ps.length<2)return;
    const alvo=from===ps[ps.length-1].id?ps[0]:ps[ps.length-1],outros=ps.filter(p=>p.id!==alvo.id),t=T();
    P(alvo.id).value=fp(Math.max(0,100-outros.reduce((a,p)=>a+pv(p.id),0)));
    if(t>0)R(alvo.id).value=toInput(Math.max(0,t-outros.reduce((a,p)=>a+cents(p.id,t),0)));
    dica(alvo);syncSl();
  }
  $("#selRegra").addEventListener("change",e=>{box.hidden=e.target.value!=="custom";if(!box.hidden)tudo()});
  ps.forEach(p=>{
    P(p.id).addEventListener("input",()=>{const t=T();if(t>0)R(p.id).value=toInput(cents(p.id,t));resto(p.id)});
    R(p.id).addEventListener("input",()=>{const t=T();if(t<=0)return;let c=parseBRL(R(p.id).value);if(isNaN(c)||c<0)c=0;P(p.id).value=fp(Math.min(100,c/t*100));resto(p.id)});
  });
  sliderIds.forEach(p=>{const el=SL(p.id);if(el)el.addEventListener("input",()=>{P(p.id).value=fp(Number(el.value));P(p.id).dispatchEvent(new Event("input",{bubbles:true}))})});
  if(vEl)vEl.addEventListener("input",tudo);
  tudo();
}

function opcoesMeses(sel){
  const ini=somaMeses(hojeId(),-24),ids=[];
  for(let i=0;i<=30;i++)ids.push(somaMeses(ini,i));
  if(sel&&!ids.includes(sel)){ids.push(sel);ids.sort()}
  return ids.map(id=>`<option value="${id}" ${id===sel?"selected":""}>${mesNome(id)}</option>`).join("");
}
/* Cria a parcela nos meses que já têm registro no banco (a partir de "desde") e ainda não a têm. Meses futuros previstos recebem a parcela sozinhos. */
async function completarParcelas(t,desde){
  desde=desde||S.mesId||hojeId();
  const linhas=[];
  for(const mid of Object.keys(S.meses).sort()){
    if(mid<desde||S.meses[mid].virtual)continue;
    const n=parcelaDoMes(t,mid);
    if(!n||S.meses[mid].contas[t.id])continue;
    linhas.push({grupo_id:gid(),mes_id:mid,conta_id:t.id,nome:t.nome,dia:t.dia,regra:t.regra,pct:t.pct||null,valor:t.valorPadrao,estimado:false,parcela:n,parcelas:t.parcelas});
  }
  if(linhas.length)await q(S.sb.from("contas_mes").insert(linhas));
  return linhas.length;
}

    cancelar+`<button class="btn" value="ok">Salvar</button>`,
    async fd=>{
      const linhas=ps.map((p,i)=>({grupo_id:gid(),id:p.id,nome:String(fd.get("n_"+p.id)).trim()||p.nome,ordem:i}));
      await q(S.sb.from("moradores").upsert(linhas));toast("Nomes atualizados.");
    });
}

/* ---------- ações ---------- */
/* Linhas de contas de um mês, a partir dos modelos de Ajustes. Contas fixas copiam o valor do mês base (ou o valor padrão);
   parcelas entram só nos meses do parcelamento, com o valor exato. */
function contasDoMes(id,base){
  const out=[];
  for(const t of S.config.contas||[]){
    const comum={conta_id:t.id,nome:t.nome,dia:t.dia,regra:t.regra,pct:t.pct||null};
    if(t.parcelas){
      const n=parcelaDoMes(t,id);if(!n)continue;
      out.push(Object.assign(comum,{valor:t.valorPadrao||0,estimado:false,parcela:n,parcelas:t.parcelas}));
    }else out.push(Object.assign(comum,{valor:base?.contas?.[t.id]?.valor??t.valorPadrao??0,estimado:true}));
  }
  return out;
}
/* Meses futuros aparecem sem precisar abrir: são previsões calculadas na tela e só viram registro no banco quando alguém lança algo neles. */
function projetar(){
  const reais=Object.keys(S.meses).sort();
  if(!reais.length)return;
  const ult=reais[reais.length-1],base=S.meses[ult],ini=ult>hojeId()?ult:hojeId();
  let fim=somaMeses(ini,12);
  for(const t of S.config.contas||[])if(t.parcelas&&t.inicio){const f=somaMeses(t.inicio,t.parcelas-1);if(f>fim)fim=f}
  const teto=somaMeses(ini,120);if(fim>teto)fim=teto;
  for(let id=nextId(ult);id<=fim;id=nextId(id)){
    const contas={};
    contasDoMes(id,base).forEach(l=>{contas[l.conta_id]={nome:l.nome,dia:l.dia,regra:l.regra,pct:l.pct,valor:l.valor,estimado:l.estimado,parcela:l.parcela||null,parcelas:l.parcelas||null}});
    S.meses[id]={rendas:base.rendas||{},contas,virtual:true};
  }
}
async function criarMes(id,base){
  await q(S.sb.from("meses").upsert({grupo_id:gid(),id,rendas:base?.rendas||{}},{onConflict:"grupo_id,id",ignoreDuplicates:true}));
  const linhas=contasDoMes(id,base).map(l=>Object.assign({grupo_id:gid(),mes_id:id},l));
  if(linhas.some(l=>"parcela" in l))linhas.forEach(l=>{if(!("parcela" in l)){l.parcela=null;l.parcelas=null}});
  if(linhas.length)await q(S.sb.from("contas_mes").upsert(linhas,{onConflict:"grupo_id,mes_id,conta_id",ignoreDuplicates:true}));
}
/* Antes de gravar qualquer coisa num mês previsto, grava o mês (e os que faltam até ele). */
async function garantirMes(mesId){
  mesId=mesId||S.mesId;
  if(!S.meses[mesId]?.virtual)return;
  await carregar();
  if(!S.meses[mesId]?.virtual)return;
  const reais=Object.keys(S.meses).filter(x=>!S.meses[x].virtual).sort();
  let base=S.meses[reais[reais.length-1]],id=reais[reais.length-1];
  while(id<mesId){
    id=nextId(id);
    await criarMes(id,base);
    const contas={};contasDoMes(id,base).forEach(l=>{contas[l.conta_id]=l});
    base={rendas:base.rendas,contas};
  }
  await carregar();
}
/* Só para o primeiro mês de um grupo (não há previsão sem um mês anterior). */
async function abrirMes(novoId){
  await carregar();
  if(!S.meses[novoId]||S.meses[novoId].virtual){
    const ids=Object.keys(S.meses).filter(x=>!S.meses[x].virtual&&x<novoId).sort(),base=ids.length?S.meses[ids[ids.length-1]]:null;
    await criarMes(novoId,base);
    toast(mesNome(novoId)+" aberto.");
  }
  S.mesId=novoId;await carregar();window.scrollTo(0,0);
}
async function delPag(id){
  if(!confirm("Excluir este movimento?"))return;
  await q(S.sb.from("pagamentos").delete().eq("grupo_id",gid()).eq("id",id));toast("Movimento excluído.");await carregar();
}
function exportCSV(){
  const qt=v=>`"${String(v??"").replace(/"/g,'""')}"`,n=c=>((c||0)/100).toFixed(2).replace(".",",");
  const L=["tipo;mes;data;despesa;pessoa;para;valor;regra;estimado;obs;parcela"];
  for(const id of Object.keys(S.meses).filter(x=>!S.meses[x].virtual).sort()){
    const m=S.meses[id];
    for(const c of Object.values(m.contas||{}))L.push(["despesa",id,"",qt(c.nome),"","",n(c.valor),qt(regraTxt(c)),c.estimado?"sim":"não","",c.parcela?c.parcela+"/"+c.parcelas:""].join(";"));
    for(const g of S.todosPags.filter(p=>p.mes===id))L.push([g.tipo==="conta"?"pagamento":"transferencia",id,g.data,qt(g.tipo==="conta"?m.contas?.[g.contaId]?.nome:""),qt(nomeDe(g.tipo==="conta"?g.quem:g.de)),qt(g.para?nomeDe(g.para):""),n(g.valor),"","",qt(g.obs),""].join(";"));
  }
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+L.join("\n")],{type:"text/csv;charset=utf-8"}));
  a.download="contas-"+slugSimples(grupoAtual()?.nome||"casa")+".csv";document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);
}

document.addEventListener("click",async e=>{
  const b=e.target.closest("[data-a]");
  if(!e.target.closest("#maismenu,#mais"))fecharMais();
  if(b){const a=b.dataset.a;if(b.closest("#drawer"))fecharDrawer();if(b.closest("#maismenu"))fecharMais();
    try{
      if(a==="pagar")dlgPagar();
      else if(a==="transf")dlgTransf(b.dataset.de,b.dataset.para,b.dataset.v?Number(b.dataset.v):null);
      else if(a==="conta")dlgConta(b.dataset.id);
      else if(a==="novaconta")dlgEditConta(null);
      else if(a==="novoparcelamento")dlgTpl(null,true);
      else if(a==="pagprev")dlgPagar(b.dataset.id,b.dataset.mes);
      else if(a==="transfprev")dlgTransf(b.dataset.de,b.dataset.para,Number(b.dataset.v),b.dataset.mes);
      else if(a==="rendas")dlgRendas();
      else if(a==="abrir"){b.disabled=true;await abrirMes(b.dataset.id)}
      else if(a==="delpag")await delPag(b.dataset.id);
      else if(a==="tpl")dlgTpl(b.dataset.id);
      else if(a==="moradores")dlgMoradores();
      else if(a==="csv")exportCSV();
      else if(a==="novogrupo")dlgNovoGrupo();
      else if(a==="renomear")dlgRenomear();
      else if(a==="excluirgrupo")dlgExcluirGrupo();
      else if(a==="addpessoa")dlgAddPessoa();
      else if(a==="rmmembro")await removerAcesso(b.dataset.email);
      else if(a==="irajustes"){S.tab="ajustes";render();window.scrollTo(0,0)}
      else if(a==="recarregar"){S.status="loading";render();await entrar(S.session)}
      else if(a==="sair"){await S.sb.auth.signOut();location.reload()}
      else if(a==="voltarlogin"){S.enviado=null;render()}
      else if(a==="modologin"){const f=$("#fLogin");if(f)S.emailLogin=String(new FormData(f).get("email")||"").trim();S.modoLogin=S.modoLogin==="link"?"senha":"link";render()}
      else if(a==="senha"){dlgSenha(false)}
      else if(a==="sairconf"){dlgSair()}
      else if(a==="hoje"){const h=hojeId();if(S.meses[h]){S.mesId=h;render();window.scrollTo(0,0)}else toast("O mês atual ainda não foi aberto.")}
    }catch(err){erro(err)}finally{if(a==="abrir"&&b.isConnected)b.disabled=false}
    return;
  }
  const t=e.target.closest("[data-tab]");
  if(t){S.tab=t.dataset.tab;fecharDrawer();render();window.scrollTo(0,0)}
  const tm=e.target.closest("[data-tema]");
  if(tm)aplicarTema(tm.dataset.tema);
});
document.addEventListener("change",async e=>{
  const s=e.target.closest("select[data-vinculo]");
  if(s){try{await vincular(s.dataset.vinculo,s.value)}catch(err){erro(err)}}
});
$("#gbtn").onclick=()=>{fecharDrawer();dlgGrupos()};
$("#menu").onclick=()=>{fecharMais();$("#drawer").showModal();const c=$("#drawer .dr");if(c)c.focus()};
$("#drawer").addEventListener("click",e=>{if(e.target===$("#drawer"))fecharDrawer()});
$("#fab").onclick=()=>dlgNovo();
$("#mais").onclick=()=>{const m=$("#maismenu");m.hidden=!m.hidden;$("#mais").setAttribute("aria-expanded",String(!m.hidden))};
document.addEventListener("keydown",e=>{if(e.key==="Escape")fecharMais()});
$("#prev").onclick=()=>{const ids=Object.keys(S.meses).sort(),i=ids.indexOf(S.mesId);if(i>0){S.mesId=ids[i-1];render()}};
$("#next").onclick=()=>{const ids=Object.keys(S.meses).sort(),i=ids.indexOf(S.mesId);if(i<0)return;if(i<ids.length-1){S.mesId=ids[i+1];render()}};

document.addEventListener("toggle",e=>{
  const d=e.target;if(!d.matches||!d.matches("details.sec"))return;
  S.sec[d.dataset.sec]=d.open;try{localStorage.setItem("sec_"+d.dataset.sec,d.open?"1":"0")}catch(err){}
},true);

/* Campos de valor: só se digitam dígitos; os dois últimos são os centavos (5, 50, 500 viram 0,05, 0,50 e 5,00). O cursor fica sempre no fim. */
function mascaraMoeda(el){
  const d=el.value.replace(/\D/g,"").slice(0,12),c=d?Number(d):0;
  el.value=c>0?toInput(c):"";
}
function cursorNoFim(el){try{const n=el.value.length;el.setSelectionRange(n,n)}catch(e){}}
document.addEventListener("input",e=>{const el=e.target;if(el&&el.matches&&el.matches("[data-money]")){mascaraMoeda(el);cursorNoFim(el)}},true);
["focusin","click","pointerup","touchend"].forEach(ev=>document.addEventListener(ev,e=>{const el=e.target;if(el&&el.matches&&el.matches("[data-money]"))setTimeout(()=>cursorNoFim(el),0)}));

let toastT;
function toast(msg){let el=$(".toast");if(!el){el=document.createElement("div");el.className="toast";el.setAttribute("role","status");document.body.appendChild(el)}el.textContent=msg;clearTimeout(toastT);toastT=setTimeout(()=>el.remove(),3200)}
function erro(err){
  console.error(err);const m=String(err?.message||"");
  if(/row-level security|permission denied/i.test(m)){toast("Sem permissão para esta ação.");return}
  if(/rate limit/i.test(m)){toast("Muitos pedidos de link. Aguarde alguns minutos.");return}
  if(/duplicate key/i.test(m)){toast("Já existe um registro igual.");return}
  if(/fetch|network/i.test(m)){toast("Sem conexão. Verifique a internet.");return}
  toast("Não foi possível concluir: "+m.slice(0,90));
}

/* ---------- início ---------- */
async function entrar(session){
  S.session=session;
  if(!session){S.status="login";render();return}
  try{
    const adm=await q(S.sb.from("admins").select("email"));
    S.admin=adm.length>0;
    await carregar();
    ouvirMudancas();
    if(S.session)setTimeout(sugerirSenha,400);
  }catch(err){erro(err);S.status="erro";render()}
}
async function init(){
  const incompleto=!CFG.url||!CFG.key||/COLE/i.test(String(CFG.url)+String(CFG.key));
  if(!window.supabase||incompleto){S.status="config";render();return}
  aplicarTema(temaAtual());
  S.sb=window.supabase.createClient(CFG.url,CFG.key);
  render();
  let atual;
  S.sb.auth.onAuthStateChange((ev,session)=>{
    const id=session?.user?.id||null;
    if(id===atual&&ev!=="SIGNED_OUT")return;
    atual=id;setTimeout(()=>entrar(session),0);
  });
}
init();
})();
